name: Release — Build All Installers

# ─────────────────────────────────────────────────────────────────────────────
# Triggered on:
#   • git tag push  (v*)  → builds installers, creates GH Release, updates README
#   • workflow_dispatch   → manual run (skips release + README update);
#                           "only: flatpak" builds just the Flatpak bundle,
#                           "only: deb" just the Linux .deb (+ verify-deb)
# Linux deliverables: the Flatpak (main) and the .deb. No AppImage / .rpm.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      only:
        description: "Which installers to build"
        type: choice
        default: all
        options:
          - all
          - flatpak
          - deb

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"
  # qtserialport: the qtpositioning NMEA plugin (libqtposition_nmea) links
  # Qt6SerialPort; without it linuxdeploy/macdeployqt/windeployqt fail resolving
  # libQt6SerialPort. The app doesn't use serial GPS — this just satisfies deploy.
  QT_MODULES: "qtcharts qtwebsockets qtmultimedia qtwebengine qtwebchannel qtpositioning qtserialport"
  QT_IFW_VERSION: "4.7"
  QT_IFW_TOOL: "tools_ifw"
  APP_NAME: FinceptTerminal
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ═════════════════════════════════════════════════════════════════════════════
# JOB 1 — Windows x64 Installer (QtIFW .exe)
# ═════════════════════════════════════════════════════════════════════════════
jobs:
  build-windows:
    name: Windows x64 Installer
    # A manual run may ask for one Linux package alone; tag pushes carry no
    # inputs and always build everything.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      # ── OpenSSL (dynamic) + zlib (STATIC) dev libs ────────────────────────
      # zlib is required by find_package(ZLIB) (InstrumentDecompress.cpp).
      #
      # HISTORY (the "z.dll missing" bug): v4.1.0 shipped a Windows exe that
      # imported a DLL named "z.dll" which was never bundled, so the app died
      # on launch with "z.dll was not found". Root cause: ZLIB_ROOT was built
      # from VCPKG_INSTALLATION_ROOT, which on the runner contains BACKSLASHES
      # (e.g. C:\vcpkg). The backslash mangled the path CMake's FindZLIB
      # consumed, so the vcpkg zlib was never found and the link fell through
      # to a stray system zlib whose import name is "z.dll". The deploy step
      # only ever copied "zlib1.dll" (the wrong name) and the final gate never
      # checked it, so the broken installer shipped silently.
      #
      # FIX: (1) normalise the path to forward slashes; (2) link zlib
      # STATICALLY via the x64-windows-static-md triplet (static lib + dynamic
      # CRT, matching Qt/MSVC /MD) so there is NO runtime zlib DLL to bundle or
      # miss; (3) pass ZLIB_ROOT + ZLIB_USE_STATIC_LIBS to configure as -D
      # cache vars (authoritative — FindZLIB does a NO_DEFAULT_PATH search of
      # ZLIB_ROOT first). The "Verify dependency closure" step below is the
      # safety net that v4.1.0 lacked.
      - name: Install OpenSSL + zlib
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          VCPKG_ROOT="${VCPKG_ROOT//\\//}"   # backslashes -> forward slashes (the v4.1.0 bug)
          "$VCPKG_ROOT/vcpkg" install openssl:x64-windows zlib:x64-windows-static-md --no-print-usage
          OPENSSL_DIR="$VCPKG_ROOT/installed/x64-windows"
          ZLIB_DIR="$VCPKG_ROOT/installed/x64-windows-static-md"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_DIR" >> "$GITHUB_ENV"
          echo "ZLIB_ROOT=$ZLIB_DIR" >> "$GITHUB_ENV"
          ls "$OPENSSL_DIR/lib/libcrypto.lib" && echo "libcrypto.lib confirmed"
          # vcpkg's static-md zlib ships the archive as "zs.lib", a name stock
          # CMake FindZLIB does NOT search for (it looks for z/zlib/zlib1/...).
          # Alias it to "zlib.lib" so find_package(ZLIB) links the static
          # archive instead of falling through to a stray system zlib (the
          # v4.1.0 "z.dll" failure mode). It's a copy, so the archive is intact.
          if [ ! -f "$ZLIB_DIR/lib/zlib.lib" ]; then
            ALT="$(ls "$ZLIB_DIR"/lib/z*.lib 2>/dev/null | head -1 || true)"
            if [ -n "$ALT" ]; then cp "$ALT" "$ZLIB_DIR/lib/zlib.lib"; echo "Aliased $(basename "$ALT") -> zlib.lib"; fi
          fi
          if [ ! -f "$ZLIB_DIR/lib/zlib.lib" ]; then
            echo "::error::static zlib archive not found in $ZLIB_DIR/lib"
            ls -la "$ZLIB_DIR/lib/" 2>&1 || true
            exit 1
          fi
          echo "static zlib confirmed: $ZLIB_DIR/lib/zlib.lib"

      # ── Qt ────────────────────────────────────────────────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-windows-x64-release

      # ── Qt Installer Framework ────────────────────────────────────────────
      - name: Install Qt Installer Framework
        shell: bash
        run: |
          pip install aqtinstall
          aqt install-tool windows desktop ${{ env.QT_IFW_TOOL }} \
            --outputdir "${{ runner.temp }}/qtifw"
          IFW_DIR="${{ runner.temp }}/qtifw/Tools/QtInstallerFramework/${{ env.QT_IFW_VERSION }}"
          echo "QT_IFW_DIR=${IFW_DIR}" >> "$GITHUB_ENV"
          echo "PATH=${IFW_DIR}/bin:${PATH}" >> "$GITHUB_ENV"

      # ── yt-dlp (bundled for dashboard video playback) ────────────────────
      - name: Install yt-dlp
        shell: bash
        run: pip install yt-dlp

      # ── Strip dangling Qt SQL driver plugin CMake configs (aqt workaround) ──
      # Same aqtinstall defect as the Linux job: Qt6Sql ships *DriverPlugin
      # CMake target files for MySQL/PSQL/ODBC/Mimer but not the plugin DLLs
      # they reference, so find_package(Qt6 ... Sql) aborts at configure time
      # ("references the file .../qsqlmysql.dll but this file does not exist").
      # We only use SQLite — drop the dangling configs before configuring.
      - name: Remove dangling Qt SQL driver plugin CMake configs
        shell: bash
        run: |
          set -euo pipefail
          SQL_CMAKE="${QT_ROOT_DIR}/lib/cmake/Qt6Sql"
          if [ -d "${SQL_CMAKE}" ]; then
            for drv in QMYSQLDriverPlugin QPSQLDriverPlugin QODBCDriverPlugin QMimerSQLDriverPlugin; do
              rm -fv "${SQL_CMAKE}/Qt6${drv}"*.cmake || true
            done
          else
            echo "::warning::${SQL_CMAKE} not found — skipping SQL plugin config cleanup"
          fi

      # ── Configure + Build ─────────────────────────────────────────────────
      - name: Configure CMake
        shell: bash
        working-directory: fincept-qt
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" \
            -DZLIB_ROOT="${ZLIB_ROOT}" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DDEPLOY_QT=ON \
            -DFINCEPT_BUILD_INSTALLER=ON \
            -DFINCEPT_REQUIRE_BUNDLED_YTDLP=ON

      - name: Build
        shell: bash
        working-directory: fincept-qt
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      # ── Verify ───────────────────────────────────────────────────────────
      - name: Verify binary
        shell: bash
        working-directory: fincept-qt
        run: |
          BINARY="build/Release/${{ env.APP_NAME }}.exe"
          [ -f "$BINARY" ] || { echo "::error::Binary not found"; exit 1; }
          echo "Binary: $BINARY ($(du -sh "$BINARY" | cut -f1))"

      # ── Deploy Qt DLLs ────────────────────────────────────────────────────
      # Mirrors the matrix build in build-cpp.yml — both must stage the SAME
      # set of DLLs, plugins, and resources or the installer ships a broken
      # app. Any addition here should also go into build-cpp.yml (and vice
      # versa). Philosophy: ship everything windeployqt might miss, even if
      # it's redundant — a 10MB larger installer is better than a crashing app.
      - name: Deploy Qt DLLs (windeployqt)
        shell: bash
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          BUILD_DIR="build/Release"
          QT_BIN="${QT_ROOT_DIR}/bin"
          QT_PLUGINS="${QT_ROOT_DIR}/plugins"

          WDQT="${QT_BIN}/windeployqt.exe"
          [ -f "$WDQT" ] && "$WDQT" --release --no-translations --compiler-runtime \
            --include-soft-plugins --force "${BUILD_DIR}/${{ env.APP_NAME }}.exe"

          # qgeoview.dll is emitted by a FetchContent target and copied next to
          # the exe by a POST_BUILD custom_command — confirm it's present so we
          # catch the case where the custom_command silently failed.
          if [ -f "${BUILD_DIR}/qgeoview.dll" ]; then
            echo "qgeoview.dll present"
          else
            echo "::warning::qgeoview.dll missing from ${BUILD_DIR} — map widget will fail to load"
          fi

          # Qt Core DLLs — belt-and-suspenders for anything windeployqt misses.
          # The Qt6WebEngine*/Qt6Qml*/Qt6Quick* set backs the KLineChart trading
          # chart (Equity Trading / Equity Research). windeployqt is unreliable at
          # deploying the WebEngine stack, and v4.1.0 shipped WITHOUT it — opening
          # the Equity Trading tab then crashed because Chromium could not find
          # QtWebEngineProcess.exe. The runtime data files (icudtl.dat / *.pak /
          # locales) and the helper exe are copied in a dedicated block below.
          for qt_dll in \
            Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Charts.dll Qt6PrintSupport.dll \
            Qt6Network.dll Qt6Sql.dll Qt6Concurrent.dll Qt6WebSockets.dll \
            Qt6Multimedia.dll Qt6MultimediaWidgets.dll Qt6OpenGL.dll \
            Qt6OpenGLWidgets.dll Qt6Svg.dll Qt6Xml.dll Qt6TextToSpeech.dll \
            Qt6WebEngineCore.dll Qt6WebEngineWidgets.dll Qt6WebChannel.dll \
            Qt6Quick.dll Qt6QuickWidgets.dll Qt6Qml.dll Qt6QmlMeta.dll \
            Qt6QmlModels.dll Qt6QmlWorkerScript.dll Qt6Positioning.dll; do
            [ -f "${QT_BIN}/${qt_dll}" ] && [ ! -f "${BUILD_DIR}/${qt_dll}" ] && \
              cp "${QT_BIN}/${qt_dll}" "${BUILD_DIR}/" || true
          done

          # OpenSSL — Qt6::Network needs these for HTTPS. Qt ships them in its
          # own bin/. Include the 1.1 names as a fallback for older Qt kits.
          for ssl_dll in \
            libssl-3-x64.dll libcrypto-3-x64.dll \
            libssl-3.dll     libcrypto-3.dll \
            libssl-1_1-x64.dll libcrypto-1_1-x64.dll; do
            [ -f "${QT_BIN}/${ssl_dll}" ] && [ ! -f "${BUILD_DIR}/${ssl_dll}" ] && \
              cp "${QT_BIN}/${ssl_dll}" "${BUILD_DIR}/" || true
            [ -f "${OPENSSL_ROOT_DIR}/bin/${ssl_dll}" ] && [ ! -f "${BUILD_DIR}/${ssl_dll}" ] && \
              cp "${OPENSSL_ROOT_DIR}/bin/${ssl_dll}" "${BUILD_DIR}/" || true
          done

          # zlib — the app now links zlib STATICALLY (x64-windows-static-md), so
          # FinceptTerminal.exe has NO runtime zlib DLL dependency. This loop is
          # kept only as a fallback in case a bundled Qt/OpenSSL DLL pulls in a
          # dynamic zlib; if neither source provides one, that's expected. The
          # "Verify dependency closure" step is the real guarantee nothing is
          # missing. (ZLIB_ROOT is the static-md dir and has no bin/*.dll.)
          for zlib_dll in zlib1.dll zlibd1.dll; do
            [ -n "${ZLIB_ROOT:-}" ] && [ -f "${ZLIB_ROOT}/bin/${zlib_dll}" ] && [ ! -f "${BUILD_DIR}/${zlib_dll}" ] && \
              cp "${ZLIB_ROOT}/bin/${zlib_dll}" "${BUILD_DIR}/" || true
            [ -f "${QT_BIN}/${zlib_dll}" ] && [ ! -f "${BUILD_DIR}/${zlib_dll}" ] && \
              cp "${QT_BIN}/${zlib_dll}" "${BUILD_DIR}/" || true
          done

          # MSVC runtime — --compiler-runtime covers most but not all VS2022 17.x
          # DLLs (msvcp170, vcruntime140_2, vccorlib140 are sometimes missed).
          for vcrt_dll in \
            vcruntime140.dll vcruntime140_1.dll vcruntime140_2.dll \
            msvcp140.dll msvcp140_1.dll msvcp140_2.dll \
            msvcp170.dll \
            concrt140.dll vccorlib140.dll; do
            SYS32="/c/Windows/System32/${vcrt_dll}"
            [ -f "$SYS32" ] && [ ! -f "${BUILD_DIR}/${vcrt_dll}" ] && \
              cp "$SYS32" "${BUILD_DIR}/" || true
          done

          # Qt plugin directories — whole-dir copy so we pick up every provided
          # plugin without maintaining a per-file allowlist.
          for plugin_dir in platforms sqldrivers imageformats iconengines styles tls \
            multimedia texttospeech networkinformation platforminputcontexts printsupport generic; do
            [ -d "${QT_PLUGINS}/${plugin_dir}" ] && \
              { mkdir -p "${BUILD_DIR}/${plugin_dir}"; \
                cp -n "${QT_PLUGINS}/${plugin_dir}/"*.dll "${BUILD_DIR}/${plugin_dir}/" 2>/dev/null || true; }
          done

          # Direct3D compiler + OpenGL SW fallback — needed on VMs / headless
          # machines without a proper GPU driver. dxcompiler/dxil: Qt 6.6+ D3D12
          # backend (DXC shader compiler) — on Win11 boxes without WinSDK.
          for d3d_dll in \
            d3dcompiler_47.dll opengl32sw.dll libEGL.dll libGLESv2.dll \
            dxcompiler.dll dxil.dll; do
            [ -f "${QT_BIN}/${d3d_dll}" ] && [ ! -f "${BUILD_DIR}/${d3d_dll}" ] && \
              cp "${QT_BIN}/${d3d_dll}" "${BUILD_DIR}/" || true
          done

          # ICU — Qt 6 on Windows ships its own ICU for Unicode support.
          for icu_dll in "${QT_BIN}"/icu*.dll; do
            base=$(basename "$icu_dll")
            [ -f "$icu_dll" ] && [ ! -f "${BUILD_DIR}/${base}" ] && \
              cp "$icu_dll" "${BUILD_DIR}/" || true
          done

          # MERGE (resources/. → resources/): windeployqt has already created
          # ${BUILD_DIR}/resources for the WebEngine paks, so a plain
          # `cp -r resources ${BUILD_DIR}/resources` nested a second copy at
          # resources/resources/.
          mkdir -p "${BUILD_DIR}/resources"
          cp -r resources/. "${BUILD_DIR}/resources/"
          bash "${GITHUB_WORKSPACE}/.github/scripts/sync_scripts.sh" scripts "${BUILD_DIR}/scripts"

          # ── Qt WebEngine runtime (KLineChart trading chart) ──────────────────
          # MUST run AFTER the repo-resources copy above so the WebEngine .pak /
          # icudtl.dat files merge INTO the existing resources/ dir (rather than
          # the dir being created here and the repo copy nesting under it).
          # Qt resolves these relative to the exe (qt.conf Prefix=.):
          #   ./QtWebEngineProcess.exe   ./resources/*.pak + icudtl.dat
          #   ./translations/qtwebengine_locales/*.pak
          # Without them, constructing a QWebEngineView aborts the whole process
          # (this is the v4.1.0 Equity-tab crash). The dependency-closure gate
          # below only inspects DLL imports, so it cannot catch these data files —
          # the essential-files check is extended to cover them instead.
          if [ -f "${QT_BIN}/QtWebEngineProcess.exe" ]; then
            cp "${QT_BIN}/QtWebEngineProcess.exe" "${BUILD_DIR}/" || true
          else
            echo "::warning::QtWebEngineProcess.exe not found in ${QT_BIN} — WebEngine chart will be unavailable"
          fi
          # Resource paks + ICU data + V8 startup snapshot live in Qt's resources/
          # dir. Without v8_context_snapshot.bin every renderer aborts at startup
          # (FATAL "Error loading V8 startup snapshot file") and all WebEngine
          # surfaces stay blank (#411).
          mkdir -p "${BUILD_DIR}/resources"
          for pak in v8_context_snapshot.bin icudtl.dat qtwebengine_resources.pak qtwebengine_resources_100p.pak \
            qtwebengine_resources_200p.pak qtwebengine_devtools_resources.pak; do
            [ -f "${QT_ROOT_DIR}/resources/${pak}" ] && \
              cp "${QT_ROOT_DIR}/resources/${pak}" "${BUILD_DIR}/resources/" || true
          done
          # WebEngine locale paks (NOT covered by windeployqt --no-translations).
          if [ -d "${QT_ROOT_DIR}/translations/qtwebengine_locales" ]; then
            mkdir -p "${BUILD_DIR}/translations/qtwebengine_locales"
            cp -n "${QT_ROOT_DIR}/translations/qtwebengine_locales/"*.pak \
              "${BUILD_DIR}/translations/qtwebengine_locales/" 2>/dev/null || true
          fi

          # qt.conf — pins plugin and data paths relative to the executable.
          # Without this, Qt falls back to hardcoded build-time paths which
          # don't exist on a clean machine and cause plugin load failures.
          printf '[Paths]\nPrefix = .\nPlugins = .\nLibraries = .\n' > "${BUILD_DIR}/qt.conf"

          # Fail early if anything essential didn't make it into the stage dir.
          echo ""
          echo "=== Staged Windows payload ==="
          MISSING=0
          for essential in \
            "${{ env.APP_NAME }}.exe" \
            Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Network.dll \
            platforms/qwindows.dll sqldrivers/qsqlite.dll \
            tls/qschannelbackend.dll; do
            if [ ! -f "${BUILD_DIR}/${essential}" ]; then
              echo "::error::Missing essential file: ${essential}"
              MISSING=1
            fi
          done

          # WebEngine runtime invariant: if we shipped the WebEngine DLL, the
          # helper exe + ICU/resource paks MUST be present too, or the Equity
          # tab crashes Chromium at view creation (the v4.1.0 regression). These
          # are data files the dependency-closure gate can't see, so check here.
          if [ -f "${BUILD_DIR}/Qt6WebEngineCore.dll" ]; then
            WE_REQUIRED="QtWebEngineProcess.exe resources/icudtl.dat resources/qtwebengine_resources.pak"
            # Required whenever this Qt kit ships one (Qt 6.8.3 x64 does) — its
            # absence kills every renderer at startup (#411).
            [ -f "${QT_ROOT_DIR}/resources/v8_context_snapshot.bin" ] && \
              WE_REQUIRED="${WE_REQUIRED} resources/v8_context_snapshot.bin"
            for we in ${WE_REQUIRED}; do
              if [ ! -f "${BUILD_DIR}/${we}" ]; then
                echo "::error::Missing WebEngine runtime file: ${we} (Equity chart would crash or stay blank)"
                MISSING=1
              fi
            done
          fi
          [ "$MISSING" -eq 1 ] && exit 1
          echo "=== $(find "${BUILD_DIR}" -type f | wc -l) files staged ==="

      # ── Dependency-closure gate ───────────────────────────────────────────
      # Walk the import table of the staged exe and, transitively, of every DLL
      # we bundle; fail the build if any imported DLL is neither bundled nor
      # provided by Windows. This is the safety net v4.1.0 lacked: that release
      # shipped an exe importing "z.dll" with no z.dll in the payload and
      # nothing caught it. A dependency is considered satisfied if it is in the
      # stage dir, is an api-ms-*/ext-ms-* virtual DLL, or exists in System32
      # (Windows ships it on every target). Anything else is a hard failure.
      #
      # NOTE: "exists in System32" trusts the runner to mirror end-user
      # machines for OS DLLs. That holds for genuine Windows components; the
      # MSVC runtime we additionally bundle ourselves. This catches the
      # missing-our-own-dependency class of bug, which is what bit v4.1.0.
      - name: Verify dependency closure
        shell: pwsh
        working-directory: fincept-qt
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path (Get-Location) 'build/Release'
          $exe = Join-Path $buildDir 'FinceptTerminal.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::Binary not found at $exe"; exit 1 }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot  = & $vswhere -latest -prerelease -property installationPath | Select-Object -First 1
          $dumpbin = Get-ChildItem "$vsroot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "::error::dumpbin.exe not found under $vsroot"; exit 1 }

          $system32 = Join-Path $env:WINDIR 'System32'
          $staged   = @{}
          Get-ChildItem -Path $buildDir -Recurse -Filter *.dll | ForEach-Object { $staged[$_.Name.ToLower()] = $true }

          function Get-Deps($path) {
            $out = & $dumpbin.FullName /dependents $path 2>$null
            $deps = @()
            foreach ($line in $out) {
              $t = $line.Trim()
              if ($t -match '(?i)^[A-Za-z0-9_\-\.]+\.dll$') { $deps += $t }
            }
            return $deps
          }

          $missing = New-Object System.Collections.Generic.List[string]
          $visited = @{}
          $queue   = New-Object System.Collections.Generic.Queue[string]
          $queue.Enqueue($exe)
          $visited[(Split-Path $exe -Leaf).ToLower()] = $true

          while ($queue.Count -gt 0) {
            $cur = $queue.Dequeue()
            foreach ($dep in (Get-Deps $cur)) {
              $low = $dep.ToLower()
              if ($visited.ContainsKey($low)) { continue }
              $visited[$low] = $true
              if ($low -like 'api-ms-*' -or $low -like 'ext-ms-*') { continue }   # virtual API set
              if ($staged.ContainsKey($low)) {
                $queue.Enqueue((Join-Path $buildDir $dep)); continue              # bundled -> recurse into it
              }
              if (Test-Path (Join-Path $system32 $dep)) { continue }              # Windows-provided
              $missing.Add($dep)
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "::error::Unbundled runtime dependencies (not in payload, not in System32):"
            $missing | Sort-Object -Unique | ForEach-Object { Write-Host "::error::  missing: $_" }
            exit 1
          }
          Write-Host "Dependency closure OK - every imported DLL is bundled or provided by Windows."

      # ── Clean-machine smoke test ──────────────────────────────────────────
      # The dependency-closure gate above only inspects DLL IMPORTS. It cannot
      # see missing runtime DATA files / helper exes (QtWebEngineProcess.exe,
      # icudtl.dat, *.pak) or runtime-loaded plugins — those abort the app only
      # when a screen is actually opened, which is exactly how v4.1.0's Equity
      # tab crashed. This step launches the STAGED build with Qt/VS/vcpkg
      # stripped from PATH (so it can use ONLY its bundled runtime + System32,
      # like an end user's clean machine) and walks every screen via
      # --smoke-test. A crash or a non-constructing screen fails the release
      # before it ships. The '[Smoke] >>> constructing <id>' breadcrumbs name
      # the exact screen if it aborts the process.
      - name: Smoke-test staged build (clean PATH, all screens)
        shell: pwsh
        working-directory: fincept-qt
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path (Get-Location) 'build/Release'
          $exe = Join-Path $buildDir 'FinceptTerminal.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::exe not found at $exe"; exit 1 }

          # Strip dev toolchains from PATH so ONLY bundled DLLs + System32 resolve
          # (reproduces an end user's machine — the whole point of this gate).
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and ($_ -notmatch '(?i)\\Qt') -and ($_ -notmatch '(?i)vcpkg') -and
            ($_ -notmatch '(?i)Microsoft Visual Studio')
          }) -join ';'
          # CI runners have no real GPU — force software GL and disable the
          # Chromium GPU/sandbox so WebEngine init doesn't false-fail headless.
          $env:QT_OPENGL = 'software'
          $env:QTWEBENGINE_DISABLE_SANDBOX = '1'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox --disable-gpu-compositing'

          $out = Join-Path $buildDir 'smoke_stdout.txt'
          $err = Join-Path $buildDir 'smoke_stderr.txt'
          Write-Host "Launching: FinceptTerminal.exe --smoke-test (clean PATH)"
          $p = Start-Process -FilePath $exe `
                 -ArgumentList '--smoke-test','--profile','ci-smoke' `
                 -WorkingDirectory $buildDir -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $p.WaitForExit(600000)) {
            Write-Host "::error::Smoke test hung (>600s) — likely a blocking dialog or a stalled screen"
            try { $p.Kill($true) } catch {}
            Write-Host "----- stderr tail -----"
            Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "----- smoke stderr -----"
          Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 100
          $code = $p.ExitCode
          Write-Host "Smoke test exit code: $code"
          if ($code -ne 0) {
            Write-Host "::error::Smoke test failed (exit $code) — the last '[Smoke] >>> constructing <id>' line above names the screen that crashed/failed on the bundled runtime."
            exit 1
          }
          Write-Host "Smoke test passed — every screen constructed on the bundled runtime."

      # ── Headless self-tests ───────────────────────────────────────────────
      # These never ran on the release path before: the self-test loop lived
      # only in build-cpp.yml, which is workflow_dispatch-only. They are
      # deterministic, headless, and exercise the tool registry, feed parsing,
      # dock layout, F&O + paper engines, portfolio monitor/replication and
      # the arena — i.e. logic the screen-construction smoke test never
      # reaches. The flag list is discovered from the binary rather than
      # hand-copied here (it drifted once: main.cpp dispatched 10 flags while
      # CI listed 9, so --selftest-live-table ran nowhere). --profile ci keeps
      # the paper/F&O engines off any real user profile.
      - name: Run self-tests (headless)
        shell: bash
        working-directory: fincept-qt
        timeout-minutes: 25
        run: bash ../.github/scripts/ci_app_checks.sh selftests "build/Release/${{ env.APP_NAME }}.exe" ci

      # ── Authenticode sign the application binary ──────────────────────────
      # Runs BEFORE cpack so the signed exe is what lands in the installer
      # payload. Without this, every Windows user hits a SmartScreen "unknown
      # publisher" block on the primary platform — and for an app that stores
      # broker credentials, an unsigned installer is also trivially
      # substitutable by a phishing build.
      #
      # Credentials come from an Azure Key Vault code-signing certificate
      # (AzureSignTool). Set these five repo secrets to enable signing:
      #   AZ_KV_URL        vault URI, e.g. https://myvault.vault.azure.net
      #   AZ_KV_CLIENT_ID  service-principal / app registration client id
      #   AZ_KV_SECRET     service-principal client secret
      #   AZ_KV_CERT       certificate name inside the vault
      #   AZ_TENANT        Entra tenant id
      # Optional: AZ_TIMESTAMP_URL (defaults to DigiCert's RFC-3161 server;
      # use http://timestamp.acs.microsoft.com for Azure Trusted Signing).
      #
      # Absent secrets → skip with a loud warning so forks and dry runs still
      # build. Present secrets → any failure fails the job.
      - name: Code-sign application binary
        shell: pwsh
        working-directory: fincept-qt
        env:
          AZ_KV_URL: ${{ secrets.AZ_KV_URL }}
          AZ_KV_CLIENT_ID: ${{ secrets.AZ_KV_CLIENT_ID }}
          AZ_KV_SECRET: ${{ secrets.AZ_KV_SECRET }}
          AZ_KV_CERT: ${{ secrets.AZ_KV_CERT }}
          AZ_TENANT: ${{ secrets.AZ_TENANT }}
          AZ_TIMESTAMP_URL: ${{ secrets.AZ_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $secrets = @($env:AZ_KV_URL, $env:AZ_KV_CLIENT_ID, $env:AZ_KV_SECRET, $env:AZ_KV_CERT, $env:AZ_TENANT)
          if ($secrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "::warning::==================== WINDOWS BUILD IS UNSIGNED ===================="
            Write-Host "::warning::Code-signing secrets (AZ_KV_URL / AZ_KV_CLIENT_ID / AZ_KV_SECRET /"
            Write-Host "::warning::AZ_KV_CERT / AZ_TENANT) are not set, so FinceptTerminal.exe and the"
            Write-Host "::warning::installer will NOT be signed. Every user will hit a SmartScreen"
            Write-Host "::warning::'unknown publisher' warning. Do not publish this as a real release."
            Write-Host "::warning::=================================================================="
            "FINCEPT_SIGNED=0" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          $ts = if ([string]::IsNullOrWhiteSpace($env:AZ_TIMESTAMP_URL)) { 'http://timestamp.digicert.com' } else { $env:AZ_TIMESTAMP_URL }

          dotnet tool install --global AzureSignTool
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::AzureSignTool install failed"; exit 1 }
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          # Our own build outputs. Qt's DLLs keep their upstream signatures (or
          # lack thereof); re-signing third-party binaries buys nothing and
          # would slow the job by minutes.
          $targets = @('build/Release/FinceptTerminal.exe')
          if (Test-Path 'build/Release/qgeoview.dll') { $targets += 'build/Release/qgeoview.dll' }

          foreach ($t in $targets) {
            Write-Host "Signing $t"
            azuresigntool sign `
              -kvu $env:AZ_KV_URL -kvi $env:AZ_KV_CLIENT_ID -kvs $env:AZ_KV_SECRET `
              -kvc $env:AZ_KV_CERT -kvt $env:AZ_TENANT `
              -tr $ts -td sha256 -fd sha256 -v $t
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Signing failed for $t"; exit 1 }
          }
          "FINCEPT_SIGNED=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Generate Installer ────────────────────────────────────────────────
      - name: Generate Installer (CPack IFW)
        shell: bash
        working-directory: fincept-qt/build
        run: |
          set -euo pipefail
          export PATH="${QT_IFW_DIR}/bin:${PATH}"
          command -v binarycreator || { echo "::error::binarycreator not found"; exit 1; }
          cpack -G IFW -C ${{ env.BUILD_TYPE }} --verbose
          ls -lh ${{ env.APP_NAME }}-*-setup* 2>/dev/null || ls -lh *.exe 2>/dev/null || true

      # ── Authenticode sign the installer + verify the signature ────────────
      # The installer is the file users actually download, so it needs its own
      # signature (the signed payload inside is invisible to SmartScreen until
      # after extraction). `signtool verify /pa` is the gate: when signing was
      # supposed to happen it must succeed, and when it was skipped the run
      # says so loudly in the job summary so an unsigned build can't ship
      # unnoticed.
      - name: Code-sign installer + verify
        shell: pwsh
        working-directory: fincept-qt/build
        env:
          AZ_KV_URL: ${{ secrets.AZ_KV_URL }}
          AZ_KV_CLIENT_ID: ${{ secrets.AZ_KV_CLIENT_ID }}
          AZ_KV_SECRET: ${{ secrets.AZ_KV_SECRET }}
          AZ_KV_CERT: ${{ secrets.AZ_KV_CERT }}
          AZ_TENANT: ${{ secrets.AZ_TENANT }}
          AZ_TIMESTAMP_URL: ${{ secrets.AZ_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Filter "${{ env.APP_NAME }}-*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::error::installer not found for signing"; exit 1 }

          # signtool ships with the Windows SDK; pick the newest x64 build.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1

          if ($env:FINCEPT_SIGNED -ne '1') {
            Write-Host "::warning::Installer $($setup.Name) is UNSIGNED (no code-signing secrets configured)."
            "### :warning: Windows installer is UNSIGNED" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``$($setup.Name)`` was built without Authenticode signing — users will see a SmartScreen 'unknown publisher' block. Configure the AZ_KV_* / AZ_TENANT secrets before publishing." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          $ts = if ([string]::IsNullOrWhiteSpace($env:AZ_TIMESTAMP_URL)) { 'http://timestamp.digicert.com' } else { $env:AZ_TIMESTAMP_URL }
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          Write-Host "Signing installer: $($setup.Name)"
          azuresigntool sign `
            -kvu $env:AZ_KV_URL -kvi $env:AZ_KV_CLIENT_ID -kvs $env:AZ_KV_SECRET `
            -kvc $env:AZ_KV_CERT -kvt $env:AZ_TENANT `
            -tr $ts -td sha256 -fd sha256 -v $setup.FullName
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Installer signing failed"; exit 1 }

          if (-not $signtool) { Write-Host "::error::signtool.exe not found — cannot verify the signature"; exit 1 }
          Write-Host "Verifying with: $($signtool.FullName) verify /pa /v"
          & $signtool.FullName verify /pa /v $setup.FullName
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::signtool verify /pa FAILED — the installer is not trusted by the Authenticode policy"; exit 1 }

          # The exe inside the payload was signed before cpack — prove it, so a
          # signed installer can never ship an unsigned application binary.
          & $signtool.FullName verify /pa /v (Join-Path (Get-Location) 'Release\FinceptTerminal.exe')
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::signtool verify /pa FAILED for the packaged FinceptTerminal.exe"; exit 1 }
          Write-Host "Installer + application signatures verified."

      # ── Validate installer PAYLOAD (not just the stage dir) ───────────────
      # The smoke test above runs against build/Release — the *staged* dir,
      # where every file exists. But CPack's install() rules decide what
      # actually lands in the installer, and a too-narrow rule (e.g. the
      # `*.dll`-only capture that shipped the v4.1.0 WebEngine crash) can drop
      # files the stage dir has. Nothing re-checked the packaged output, so the
      # regression shipped. Silently install to a temp dir and assert the
      # runtime files the app needs are actually present in what the user gets.
      - name: Verify installer payload (silent install + file tree)
        shell: pwsh
        working-directory: fincept-qt/build
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Filter "${{ env.APP_NAME }}-*-windows-x64-setup.exe" |
                   Select-Object -First 1
          if (-not $setup) { Write-Host "::error::installer not found for payload check"; exit 1 }
          $dest = Join-Path $env:RUNNER_TEMP 'fincept-payload-check'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Write-Host "Silent-installing $($setup.Name) -> $dest"
          # IFW unattended install, matching the Qt IFW-documented form:
          #   installer --root <dir> --accept-licenses --default-answer \
          #             --confirm-command install
          # Do NOT pass --accept-messages together with --default-answer: IFW
          # rejects them as "mutually exclusive" and exits 1 before installing
          # anything. --default-answer alone answers any message query with its
          # default, which is all a clean install to an empty dir needs.
          # controlscript.qs auto-advances the wizard pages for CLI instances.
          #
          # IFW's setup.exe is a *windowed* app, so its CLI output never reaches
          # the Actions log on its own — redirect stdout/stderr to files (and add
          # --verbose) so a failure is diagnosable instead of an opaque exit 1.
          $outLog = Join-Path $env:RUNNER_TEMP 'ifw-install.out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'ifw-install.err.log'
          $p = Start-Process -FilePath $setup.FullName -PassThru -Wait `
                 -RedirectStandardOutput $outLog -RedirectStandardError $errLog `
                 -ArgumentList @(
                   '--verbose',
                   '--root', $dest,
                   '--accept-licenses',
                   '--default-answer', '--confirm-command',
                   'install' )
          Write-Host "----- installer stdout -----"
          if (Test-Path $outLog) { Get-Content $outLog | Write-Host }
          Write-Host "----- installer stderr -----"
          if (Test-Path $errLog) { Get-Content $errLog | Write-Host }
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::Silent install failed (exit $($p.ExitCode)). See installer stdout/stderr above."
            exit 1
          }
          # Essential files the installed tree MUST contain. WebEngine entries
          # are conditional: only required if the WebEngine DLL was packaged.
          $missing = 0
          $required = @(
            'FinceptTerminal.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll',
            'qt.conf', 'platforms/qwindows.dll', 'sqldrivers/qsqlite.dll'
          )
          if (Test-Path (Join-Path $dest 'Qt6WebEngineCore.dll')) {
            $required += @(
              'QtWebEngineProcess.exe',
              'resources/icudtl.dat',
              'resources/qtwebengine_resources.pak'
            )
            # 4.5.1 shipped without the V8 snapshot even though the stage dir had
            # it (#411) — this check is what would have caught it. Require it
            # whenever the staged tree carries one.
            if (Test-Path 'Release/resources/v8_context_snapshot.bin') {
              $required += 'resources/v8_context_snapshot.bin'
            }
          }
          # Same failure class: yt-dlp.exe sat in the stage dir but no install()
          # rule captured it, so installed builds had no video playback.
          if (Test-Path 'Release/yt-dlp.exe') {
            $required += 'yt-dlp.exe'
          }
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $dest $f))) {
              Write-Host "::error::Installer payload missing: $f (would crash on a clean machine)"
              $missing = 1
            }
          }
          if ($missing) {
            Write-Host "----- installed tree (top level) -----"
            Get-ChildItem $dest | Select-Object Name | Format-Table -AutoSize
            exit 1
          }
          Write-Host "Installer payload OK — all essential runtime files present in the shipped tree."

      # ── Upload ────────────────────────────────────────────────────────────
      # Narrow the glob to the installer output — the broader `*.exe` pattern
      # would also catch the main FinceptTerminal.exe binary, which we don't
      # want to publish as a release asset (users should run the installer).
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FinceptTerminal-Windows-x64-installer
          path: fincept-qt/build/FinceptTerminal-*-windows-x64-setup.exe
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 2 — Linux x64 .deb (bundled Qt under /opt/fincept-terminal-community)
#
# Linux ships the Flatpak (JOB 4, the main Linux package) and this .deb. The
# AppImage, the .rpm and the Linux IFW wizard are no longer built: Fedora,
# RHEL, Arch, openSUSE and other non-Debian users install the Flatpak. Built
# on ubuntu-22.04 (glibc 2.35), so the .deb targets Ubuntu 22.04+ / Debian 12+
# and derivatives; JOB 2b (verify-deb) installs and opens it on each of them.
# ═════════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux x64 .deb
    # Manual runs: "all" and "deb" build it, "flatpak" does not. Tag pushes
    # carry no inputs and always build everything.
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'flatpak'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-x64-release-${{ env.QT_VERSION }}
          max-size: 500M
          # update-package-index is unset: the "Install system dependencies"
          # step below already runs apt-get update, so this action's own
          # update is redundant and was observed to hang the runner.

      # ── System deps ───────────────────────────────────────────────────────
      # ubuntu-22.04 ships g++ 11.4, but CMakeLists.txt enforces GCC 12.3+.
      # No apt Qt: 22.04 ships Qt 6.2 and CMakeLists pins Qt 6.8.3 EXACT, so Qt
      # comes from install-qt-action below. The XCB / GL / Wayland client libs
      # let Qt's platform plugins link at build time and linuxdeploy resolve them.
      - name: Install system dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build gcc-12 g++-12 \
            libssl-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-cursor-dev \
            libxcb-icccm4 libxcb-icccm4-dev \
            libxcb-image0  libxcb-image0-dev \
            libxcb-keysyms1 libxcb-keysyms1-dev \
            libxcb-randr0 \
            libxcb-render-util0 libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0 libxcb-xinerama0-dev \
            libxcb-xkb1 libxkbcommon-x11-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            python3 python3-pip pkg-config zip \
            wget file imagemagick
          echo "CC=gcc-12"  >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      # ── Qt 6.8.3 (matches CMakeLists' Qt6 EXACT pin) ──────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-linux-x64-release

      # ── yt-dlp (bundled for dashboard video playback) ────────────────────
      - name: Install yt-dlp
        run: pip install yt-dlp

      # ── Linux desktop icon ────────────────────────────────────────────────
      # The repo ships resources/fincept.ico only; the package's hicolor icons
      # are scaled from this PNG. Runs BEFORE `cmake -B build`: CMake's own
      # Linux install rule tests for resources/fincept.png at configure time.
      - name: Generate Linux icon PNG
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          if [ ! -f resources/fincept.png ]; then
            if [ -f resources/icons/app_icon_256.png ]; then
              cp resources/icons/app_icon_256.png resources/fincept.png
            elif [ -f resources/fincept.ico ]; then
              # ICO may hold multiple frames — [0] selects the primary/largest.
              convert "ico:resources/fincept.ico[0]" -resize 256x256 -background none -flatten "png:resources/fincept.png"
            else
              # Solid-color last resort, written with a valid IDAT+CRC.
              convert -size 256x256 xc:'#1a1a1a' "png:resources/fincept.png"
            fi
          fi
          if [ ! -s resources/fincept.png ] || ! file resources/fincept.png | grep -q 'PNG image data' \
             || ! identify resources/fincept.png >/dev/null 2>&1; then
            echo "::error::resources/fincept.png is missing or not a valid PNG"
            file resources/fincept.png 2>&1 || true
            exit 1
          fi
          echo "Icon ready: resources/fincept.png ($(identify -format '%wx%h' resources/fincept.png))"

      # ── Strip dangling Qt SQL driver plugin CMake configs (aqt workaround) ──
      # aqtinstall ships Qt6Sql's MySQL/PSQL/ODBC/Mimer *DriverPlugin CMake
      # target files but NOT the plugin binaries they reference, so
      # find_package(Qt6 ... Sql) aborts at configure time. We only use SQLite.
      # MUST run before "Configure CMake".
      - name: Remove dangling Qt SQL driver plugin CMake configs
        run: |
          set -euo pipefail
          SQL_CMAKE="${QT_ROOT_DIR}/lib/cmake/Qt6Sql"
          if [ -d "${SQL_CMAKE}" ]; then
            for drv in QMYSQLDriverPlugin QPSQLDriverPlugin QODBCDriverPlugin QMimerSQLDriverPlugin; do
              rm -fv "${SQL_CMAKE}/Qt6${drv}"*.cmake || true
            done
          else
            echo "::warning::${SQL_CMAKE} not found — skipping SQL plugin config cleanup"
          fi

      # ── Configure + Build ─────────────────────────────────────────────────
      # No FINCEPT_BUILD_INSTALLER: there is no CPack/IFW installer on Linux;
      # the .deb is assembled from the build tree below.
      - name: Configure CMake
        working-directory: fincept-qt
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DOPENSSL_ROOT_DIR=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFINCEPT_REQUIRE_BUNDLED_YTDLP=ON

      - name: Build
        working-directory: fincept-qt
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel $(nproc) -- -k 0

      - name: Verify binary
        working-directory: fincept-qt
        run: |
          BINARY="build/${{ env.APP_NAME }}"
          [ -f "$BINARY" ] || { echo "::error::Binary not found"; exit 1; }
          echo "Binary: $BINARY ($(du -sh "$BINARY" | cut -f1))"
          file "$BINARY"

      # ── Headless self-tests (build-tree binary) ───────────────────────────
      # Before packaging, so a logic regression fails in minutes. Flags are
      # discovered from the binary; --profile ci keeps the paper and F&O
      # engines off any real profile (.github/scripts/ci_app_checks.sh).
      - name: Run self-tests (headless)
        working-directory: fincept-qt
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH:-}"
          bash ../.github/scripts/ci_app_checks.sh selftests "build/${{ env.APP_NAME }}" ci

      # ── Bundle Qt into build/AppDir/usr (linuxdeploy; no AppImage) ────────
      # No distribution ships Qt 6.8 and the binary uses Qt private API (no ABI
      # promise across minor versions), so the .deb carries its own Qt (#415).
      # linuxdeploy + its Qt plugin are the deploy tool (as windeployqt and
      # macdeployqt are on the other platforms): they copy the Qt libraries,
      # plugins and WebEngine runtime the binary needs and give every ELF an
      # $ORIGIN-relative RUNPATH. No --output, so no AppImage is produced; the
      # tools are AppImages themselves, so APPIMAGE_EXTRACT_AND_RUN=1 runs them
      # without FUSE. The next step checks and finishes the tree.
      - name: Bundle Qt (linuxdeploy, directory output)
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          APPDIR="build/AppDir"
          rm -rf "${APPDIR}"
          mkdir -p "${APPDIR}/usr/bin" "${APPDIR}/usr/share/applications" \
                   "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          install -m 755 "build/${{ env.APP_NAME }}" "${APPDIR}/usr/bin/"
          # App resources + Python scripts beside the binary (AppPaths on Linux).
          cp -r resources "${APPDIR}/usr/bin/resources"
          bash "${GITHUB_WORKSPACE}/.github/scripts/sync_scripts.sh" scripts "${APPDIR}/usr/bin/scripts"
          # linuxdeploy does not finish without a desktop entry and an icon. Only
          # usr/ goes into the package, which installs its own copies of both.
          install -m 644 packaging/linux/fincept-terminal.desktop \
            "${APPDIR}/usr/share/applications/fincept-terminal-community.desktop"
          install -m 644 resources/fincept.png \
            "${APPDIR}/usr/share/icons/hicolor/256x256/apps/fincept-terminal-community.png"

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          # linuxdeploy finds its Qt plugin on PATH; the plugin finds Qt through
          # qmake (the install-qt-action kit).
          export PATH="${PWD}:${QT_ROOT_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH:-}"
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"

          # Only SQLite is used; the other SQL driver plugins need client
          # libraries the runner lacks (libmimerapi.so) and fail the deploy.
          rm -f "${QT_ROOT_DIR}/plugins/sqldrivers/"libqsql{mimer,odbc,psql,mysql}.so

          # The Qt plugin deploys only the xcb platform plugin by default; up to
          # v4.5.2 a Wayland session without XWayland then aborted at start
          # ("no Qt platform plugin could be initialized"). These add the two
          # wayland platform plugins and their shell/decoration/graphics plugins.
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          export EXTRA_QT_MODULES="waylandcompositor"

          ./linuxdeploy-x86_64.AppImage --appdir "${APPDIR}" --plugin qt \
            --desktop-file "${APPDIR}/usr/share/applications/fincept-terminal-community.desktop" \
            --icon-file "${APPDIR}/usr/share/icons/hicolor/256x256/apps/fincept-terminal-community.png"

      # ── Stage and check the package tree (#415) ───────────────────────────
      #   /opt/fincept-terminal-community/      the bundle (bin/ lib/ plugins/ libexec/ resources/ ...)
      #   /usr/bin/fincept-terminal-community   symlink to bin/FinceptTerminal — no wrapper, no
      #       LD_LIBRARY_PATH: libraries resolve through each ELF's $ORIGIN RUNPATH and plugins
      #       through bin/qt.conf, so nothing leaks into the managed Python, yt-dlp or the other
      #       programs the terminal starts
      #   /usr/share/{applications,metainfo,icons/hicolor/<n>x<n>/apps,doc,lintian/overrides}
      # Not /opt/fincept-terminal, /usr/bin/fincept-terminal or fincept-terminal.desktop: those
      # are the private build's "fincept-terminal" package, which installs side by side.
      #
      # Host-integration libraries — the C++ runtime, OpenSSL, NSS, GLib/GTK, X11/xcb,
      # Wayland/GL, D-Bus, fontconfig, ALSA/Pulse — come from the system, never the bundle:
      # a copy from this 22.04 runner breaks newer systems' Mesa / GTK / NSS modules loaded into
      # the same process, NSS loads libsoftokn3 by path, and the system's OpenSSL pair gets
      # security updates (#352: a bundled libcrypto next to the system libssl broke all TLS).
      # Qt's own libraries (and ICU, FFmpeg) stay bundled.
      #
      # Fails on: a missing runtime piece, an ELF that does not resolve with LD_LIBRARY_PATH
      # unset, a Qt library or a RUNPATH from outside the bundle, a host library no distro
      # package owns, a glibc / libstdc++ floor above Ubuntu 22.04 / Debian 12.
      # Writes build/pkg-depends.txt from the bundle's DIRECT host needs.
      - name: Stage package tree
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          PREFIX="/opt/fincept-terminal-community"
          LAUNCHER="fincept-terminal-community"
          ROOT="${PWD}/build/pkg-root"
          DEST="${ROOT}${PREFIX}"
          die() { echo "::error::$*"; exit 1; }
          rm -rf "${ROOT}"
          mkdir -p "${DEST}" "${ROOT}/usr/bin"
          cp -a build/AppDir/usr/. "${DEST}/"
          # linuxdeploy's copies; the package installs its own below.
          rm -rf "${DEST}/share/applications" "${DEST}/share/icons" "${DEST}/share/metainfo"

          # Host-integration libraries back to the system (see above). Only copies
          # linuxdeploy took from this runner: a name the Qt kit ships stays.
          for lib in "${DEST}"/lib/*.so*; do
            name="$(basename "${lib}")"
            [ -e "${QT_ROOT_DIR}/lib/${name}" ] && continue
            case "${name}" in
              libstdc++.so.*|libgcc_s.so.*|libssl.so.*|libcrypto.so.*|\
              libnss3.so|libnssutil3.so|libsmime3.so|libssl3.so|libnspr4.so|libplc4.so|libplds4.so|\
              libsoftokn3.so|libfreebl*.so|libnssckbi.so|\
              libglib-2.0.so.*|libgobject-2.0.so.*|libgio-2.0.so.*|libgmodule-2.0.so.*|libgthread-2.0.so.*|\
              libgtk-3.so.*|libgdk-3.so.*|libgdk_pixbuf-2.0.so.*|libpango*-1.0.so.*|libcairo*.so.*|\
              libatk*.so.*|libatspi.so.*|libharfbuzz*.so.*|\
              libX*.so.*|libxcb*.so.*|libxkbcommon*.so.*|libwayland-*.so.*|libdrm*.so.*|libgbm.so.*|\
              libEGL*.so.*|libGL*.so.*|libOpenGL.so.*|\
              libdbus-1.so.*|libsystemd.so.*|libudev.so.*|libfontconfig.so.*|libfreetype.so.*|\
              libexpat.so.*|libz.so.*|libasound.so.*|libpulse*.so*)
                echo "from the system, not bundled: ${name}"
                rm -f "${lib}" ;;
            esac
          done
          # No caches, VCS or OS litter in the package.
          find "${DEST}" \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find "${DEST}" -type f \( -name '*.pyc' -o -name '.git*' -o -name .DS_Store -o -name Thumbs.db \) -delete

          # Qt WebEngine data next to what linuxdeploy copied (resources/*.pak,
          # icudtl.dat, v8_context_snapshot.bin, locales). Without the V8 snapshot
          # every renderer aborts and all web views stay blank (#411).
          if [ -e "${DEST}/lib/libQt6WebEngineCore.so.6" ]; then
            mkdir -p "${DEST}/resources" "${DEST}/translations/qtwebengine_locales"
            for f in "${QT_ROOT_DIR}"/resources/*; do
              [ -e "${DEST}/resources/$(basename "${f}")" ] || cp -a "${f}" "${DEST}/resources/"
            done
            [ ! -d "${QT_ROOT_DIR}/translations/qtwebengine_locales" ] \
              || cp -an "${QT_ROOT_DIR}/translations/qtwebengine_locales/." "${DEST}/translations/qtwebengine_locales/"
          fi

          install -m 755 build/yt-dlp "${DEST}/bin/yt-dlp"   # private copy, never on $PATH (#415)
          # Complete uninstaller (package + the user's data, on request).
          install -m 755 packaging/uninstall/uninstall.sh "${DEST}/uninstall.sh"
          install -D -m 644 packaging/linux/deb/apparmor-profile "${DEST}/share/apparmor/${LAUNCHER}"
          # Absolute target: the link crosses top-level directories (Debian policy 10.5).
          ln -s "${PREFIX}/bin/FinceptTerminal" "${ROOT}/usr/bin/${LAUNCHER}"

          # Desktop entry under the edition's desktop id (the Wayland app_id), Exec
          # absolute — a bare name would run whatever $PATH finds first.
          install -d -m 755 "${ROOT}/usr/share/applications" "${ROOT}/usr/share/metainfo"
          sed "s|^Exec=.*|Exec=${PREFIX}/bin/FinceptTerminal|" packaging/linux/fincept-terminal.desktop \
            >"${ROOT}/usr/share/applications/${LAUNCHER}.desktop"
          grep -qx "Exec=${PREFIX}/bin/FinceptTerminal" "${ROOT}/usr/share/applications/${LAUNCHER}.desktop" \
            || die "the desktop entry's Exec line was not pointed at ${PREFIX}/bin/FinceptTerminal"
          # AppStream file named after its component id; the command on $PATH is the launcher.
          sed "s|<binary>FinceptTerminal</binary>|<binary>${LAUNCHER}</binary>|" \
            packaging/linux/fincept-terminal.appdata.xml \
            >"${ROOT}/usr/share/metainfo/com.fincept.terminal.community.metainfo.xml"
          for s in 16 24 32 48 64 128 256; do
            install -d -m 755 "${ROOT}/usr/share/icons/hicolor/${s}x${s}/apps"
            convert resources/fincept.png -resize "${s}x${s}" -background none -gravity center \
              -extent "${s}x${s}" "png:${ROOT}/usr/share/icons/hicolor/${s}x${s}/apps/${LAUNCHER}.png"
          done

          # Docs: copyright (the project's AGPL text) and a changelog (native package).
          VERSION=$(grep -Po 'project\(FinceptTerminal VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          [ -n "${VERSION}" ] || die "could not parse project VERSION from CMakeLists.txt"
          DOC="${ROOT}/usr/share/doc/${LAUNCHER}"
          install -d -m 755 "${DOC}"
          {
            echo "Fincept Terminal Community (${LAUNCHER})"
            echo "Copyright (C) Fincept Corporation <support@fincept.in>"
            echo "Source: https://github.com/Fincept-Corporation/FinceptTerminal"
            echo
            echo "Licensed under the GNU Affero General Public License, version 3 or later"
            echo "(full text below). Bundled third-party components keep their own licences:"
            echo "Qt 6 (LGPL-3, /usr/share/common-licenses/LGPL-3), Chromium via Qt WebEngine"
            echo "(BSD-style and others, see ${PREFIX}/share/doc) and yt-dlp (Unlicense)."
            echo
            cat ../LICENSE
          } >"${DOC}/copyright"
          printf '%s (%s) stable; urgency=medium\n\n  * Release %s; notes on the GitHub release page.\n\n -- Fincept Corporation <support@fincept.in>  %s\n' \
            "${LAUNCHER}" "${VERSION}" "${VERSION}" "$(git log -1 --format=%cD)" | gzip -9n >"${DOC}/changelog.gz"
          install -D -m 644 packaging/linux/deb/lintian-overrides "${ROOT}/usr/share/lintian/overrides/${LAUNCHER}"

          # Modes: 0755 dirs and executables, 0644 everything else (shared
          # libraries too); nothing setuid or world-writable. Owner root:root
          # comes from dpkg-deb --root-owner-group.
          find "${ROOT}" -type d -exec chmod 755 {} +
          find "${ROOT}" -type f -perm /111 -exec chmod 755 {} +
          find "${ROOT}" -type f ! -perm /111 -exec chmod 644 {} +
          find "${ROOT}" -type f \( -name '*.so' -o -name '*.so.*' \) -exec chmod 644 {} +

          # ── Runtime pieces loaded by path (ldd cannot see them) ────────────
          REQUIRED="bin/FinceptTerminal bin/qt.conf bin/yt-dlp bin/resources bin/scripts
                    bin/resources/requirements-numpy2.txt uninstall.sh share/apparmor/${LAUNCHER}
                    plugins/platforms/libqxcb.so plugins/sqldrivers/libqsqlite.so plugins/tls/libqopensslbackend.so
                    plugins/platforms/libqwayland-egl.so plugins/platforms/libqwayland-generic.so
                    plugins/wayland-shell-integration/libxdg-shell.so lib/libQt6WaylandClient.so.6"
          if [ -e "${DEST}/lib/libQt6WebEngineCore.so.6" ]; then
            REQUIRED="${REQUIRED} libexec/QtWebEngineProcess resources/icudtl.dat resources/qtwebengine_resources.pak"
            [ -f "${QT_ROOT_DIR}/resources/v8_context_snapshot.bin" ] && REQUIRED="${REQUIRED} resources/v8_context_snapshot.bin"
          fi
          for req in ${REQUIRED}; do
            [ -e "${DEST}/${req}" ] || die "package tree is missing ${PREFIX}/${req}"
          done
          for dir in wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
            [ -n "$(ls -A "${DEST}/plugins/${dir}" 2>/dev/null)" ] || die "${PREFIX}/plugins/${dir}/ is missing or empty — no Wayland without XWayland"
          done
          for x in bin/FinceptTerminal bin/yt-dlp libexec/QtWebEngineProcess; do
            [ ! -e "${DEST}/${x}" ] || [ -x "${DEST}/${x}" ] || die "${PREFIX}/${x} is not executable"
          done
          grep -q '^Prefix' "${DEST}/bin/qt.conf" || die "bin/qt.conf has no Prefix: Qt would look for plugins in the build machine's paths"
          echo "qt.conf: $(tr '\n' ' ' <"${DEST}/bin/qt.conf")"
          # #352: OpenSSL is one pair, from the system — both or neither bundled.
          if [ -e "${DEST}/lib/libssl.so.3" ] || [ -e "${DEST}/lib/libcrypto.so.3" ]; then
            die "a bundled OpenSSL library is left in ${PREFIX}/lib — the TLS pair must come from the system (#352)"
          fi

          # ── Library closure and Depends ────────────────────────────────────
          WORK="$(mktemp -d)"
          : >"${WORK}/direct"; : >"${WORK}/missing"; : >"${WORK}/leaks"; : >"${WORK}/glibc"; : >"${WORK}/glibcxx"
          elf_count=0
          while IFS= read -r -d '' f; do
            [ "$(head -c 4 "${f}" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ] || continue
            elf_count=$((elf_count + 1))
            rel="${f#"${ROOT}"}"
            vers="$(readelf -V --wide "${f}" 2>/dev/null || true)"
            printf '%s\n' "${vers}" | { grep -oE 'Name: GLIBC_[0-9]+(\.[0-9]+)+' || true; } | sed 's/^Name: GLIBC_//' >>"${WORK}/glibc"
            printf '%s\n' "${vers}" | { grep -oE 'Name: GLIBCXX_[0-9]+(\.[0-9]+)+' || true; } | sed 's/^Name: GLIBCXX_//' >>"${WORK}/glibcxx"
            dyn="$(readelf -d "${f}" 2>/dev/null || true)"
            rpath="$(printf '%s\n' "${dyn}" | sed -n 's/.*(\(RPATH\|RUNPATH\)).*\[\(.*\)\]/\1=\2/p')"
            case "${rpath}" in
              *"${QT_ROOT_DIR}"*|*/home/*|*/tmp/*) echo "RUNPATH ${rpath} (${rel})" >>"${WORK}/leaks" ;;
            esac
            needed="$(printf '%s\n' "${dyn}" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')"
            ldd_out="$(env -u LD_LIBRARY_PATH ldd "${f}" 2>&1 || true)"
            printf '%s\n' "${ldd_out}" | { grep 'not found' || true; } | sed "s|^|${rel}: |" >>"${WORK}/missing"
            while read -r soname arrow path _; do
              [ "${arrow}" = "=>" ] || continue
              [ "${path}" != "not" ] || continue
              real="$(readlink -f "${path}")"
              case "${real}" in "${DEST}"/*) continue ;; esac
              case "${soname}" in libQt6*) echo "${soname} -> ${real} (${rel})" >>"${WORK}/leaks" ;; esac
              # Direct needs only: a system library's own dependencies are its package's business.
              case $'\n'"${needed}"$'\n' in *$'\n'"${soname}"$'\n'*) echo "${path}" >>"${WORK}/direct" ;; esac
            done <<<"${ldd_out}"
          done < <(find "${DEST}" -type f -print0)
          [ "${elf_count}" -gt 0 ] || die "no ELF files found under ${DEST}"
          if [ -s "${WORK}/missing" ]; then sort -u "${WORK}/missing"; die "unresolved libraries in the package tree (above)"; fi
          if [ -s "${WORK}/leaks" ]; then sort -u "${WORK}/leaks"; die "Qt libraries or RUNPATHs point outside the package (above)"; fi

          # Owning package of a host library; dpkg records /lib and /usr/lib (usrmerge).
          owner_pkg() {
            local p c pkg
            for p in "$1" "$(readlink -f "$1")"; do
              for c in "${p}" "/usr${p}" "${p#/usr}"; do
                pkg="$(dpkg-query -S "${c}" 2>/dev/null | awk -F': ' '!/^diversion/ { split($1, a, ":"); print a[1]; exit }')" || true
                if [ -n "${pkg}" ]; then echo "${pkg}"; return 0; fi
              done
            done
            return 1
          }
          : >"${WORK}/pkgs"
          while read -r lib; do
            pkg="$(owner_pkg "${lib}")" || die "host library ${lib} belongs to no distro package — users would not have it"
            echo "${pkg}" >>"${WORK}/pkgs"
            echo "  host: ${lib} (${pkg})"
          done < <(sort -u "${WORK}/direct")

          # Floors: libc6 from the newest GLIBC symbol any shipped ELF needs; the
          # C++ runtime from GLIBCXX (3.4.30 = GCC 12, Ubuntu 22.04 / Debian 12).
          GLIBC_MIN="$(sort -V -u "${WORK}/glibc" | tail -n 1)"
          [ -n "${GLIBC_MIN}" ] || die "could not determine the minimum glibc version"
          [ "$(printf '2.35\n%s\n' "${GLIBC_MIN}" | sort -V | tail -n 1)" = 2.35 ] \
            || die "the package needs glibc ${GLIBC_MIN}, above Ubuntu 22.04's 2.35"
          GLIBCXX_MIN="$(sort -V -u "${WORK}/glibcxx" | tail -n 1)"
          [ -z "${GLIBCXX_MIN}" ] || [ "$(printf '3.4.30\n%s\n' "${GLIBCXX_MIN}" | sort -V | tail -n 1)" = 3.4.30 ] \
            || die "the package needs GLIBCXX_${GLIBCXX_MIN}, above GCC 12's 3.4.30 (Ubuntu 22.04 / Debian 12)"
          # Ubuntu 24.04+ / Debian 13 renamed these for 64-bit time_t (…t64); list both.
          t64() {
            case "$1" in
              libasound2|libatk-bridge2.0-0|libatk1.0-0|libatspi2.0-0|libcups2|libcurl4|libglib2.0-0|\
              libgnutls30|libgtk-3-0|libpng16-16|libssl3|libnettle8|libhogweed6|libelf1|libevent-2.1-7)
                echo "$1t64 | $1" ;;
              libstdc++6) echo "libstdc++6 (>= 12)" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "libc6 (>= ${GLIBC_MIN})"
            # Not visible to ldd: the TLS trust store, fonts, opening links / files.
            printf '%s\n' ca-certificates fontconfig xdg-utils
            sort -u "${WORK}/pkgs" | { grep -vx 'libc6' || true; } | while read -r p; do t64 "${p}"; done
          } | awk '!seen[$0]++' | paste -sd ',' - | sed 's/,/, /g' >build/pkg-depends.txt
          if [ -e "${DEST}/lib/libQt6WebEngineCore.so.6" ]; then
            grep -q 'libnss3' build/pkg-depends.txt || die "Qt WebEngine is bundled but libnss3 is not in Depends"
          fi
          rm -rf "${WORK}"
          echo "Staged ${PREFIX}: ${elf_count} ELF files, all resolved (Qt from the package only)"
          echo "Depends: $(cat build/pkg-depends.txt)"

      # ── Build the .deb ────────────────────────────────────────────────────
      # Package fincept-terminal-community (CMakeLists.txt "Edition identity"):
      # the private build's package is fincept-terminal, and the two install
      # side by side (no shared path, no Conflicts/Replaces between them).
      - name: Build .deb package
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          VERSION=$(grep -Po 'project\(FinceptTerminal VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          DEB_ROOT="build/pkg-root"
          OUT="build/FinceptTerminal-${VERSION}-linux-x64.deb"
          rm -rf "${DEB_ROOT}/DEBIAN"
          install -d -m 755 "${DEB_ROOT}/DEBIAN"
          install -m 755 packaging/linux/deb/postinst packaging/linux/deb/postrm "${DEB_ROOT}/DEBIAN/"
          ( cd "${DEB_ROOT}" && find . -path ./DEBIAN -prune -o -type f -printf '%P\0' | LC_ALL=C sort -z \
              | xargs -0 md5sum ) >"${DEB_ROOT}/DEBIAN/md5sums"
          INSTALLED_SIZE="$(du -sk --apparent-size --exclude=DEBIAN "${DEB_ROOT}" | cut -f1)"
          {
            echo "Package: fincept-terminal-community"
            echo "Version: ${VERSION}"
            echo "Architecture: amd64"
            echo "Maintainer: Fincept Corporation <support@fincept.in>"
            echo "Installed-Size: ${INSTALLED_SIZE}"
            echo "Depends: $(cat build/pkg-depends.txt)"
            # PortAudio: voice input (the sounddevice wheel does not bundle it on
            # Linux). pkexec: the in-app updater asks for the password with it.
            # curl: the Python setup's fallback download of uv.
            echo "Recommends: libportaudio2, pkexec | policykit-1, curl"
            echo "Suggests: espeak-ng"
            echo "Section: misc"
            echo "Priority: optional"
            echo "Homepage: https://github.com/Fincept-Corporation/FinceptTerminal"
            echo "Description: Professional financial intelligence terminal"
            echo " Native C++20 desktop terminal with real-time market data, AI analytics,"
            echo " multi-broker trading, portfolio management and 1300+ Python analytics"
            echo " scripts. Qt 6.8 is bundled under /opt/fincept-terminal-community."
          } >"${DEB_ROOT}/DEBIAN/control"
          chmod 644 "${DEB_ROOT}/DEBIAN/control" "${DEB_ROOT}/DEBIAN/md5sums"
          cat "${DEB_ROOT}/DEBIAN/control"
          dpkg-deb --build --root-owner-group -Zxz "${DEB_ROOT}" "${OUT}"
          dpkg-deb --info "${OUT}" >/dev/null
          echo "Built: ${OUT} ($(du -sh "${OUT}" | cut -f1))"

      # ── Upload ────────────────────────────────────────────────────────────
      # Version-stamped name: the update manifest lists it by exact name
      # (generate_updates_manifest.py, key linux-x64-deb).
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FinceptTerminal-Linux-x64-installer
          path: fincept-qt/build/FinceptTerminal-*-linux-x64.deb
          if-no-files-found: error
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 2b — the .deb, installed and opened the way users do
#
# Each leg starts from a clean base and, as root: installs the .deb with
# apt-get --no-install-recommends (proves Depends resolve and suffice), runs
# ldd over every ELF in the package with LD_LIBRARY_PATH unset, checks
# ownership / modes / launcher / desktop entry / icons, then — as a
# non-root user with a fresh HOME — opens it: the first start from the
# desktop entry's Exec (setup screen), the screen walk (--smoke-test) on
# X11 (Xvfb, QT_QPA_PLATFORM=xcb) and on Wayland (headless weston,
# QT_QPA_PLATFORM=wayland, plus a start with no X at all), and scans the
# output and fincept.log for start-up errors. Finally apt-get remove + purge
# must leave nothing outside the user's home.
#
#   containers  docker on the runner (QtWebEngine's sandbox cannot create user
#               namespaces in a container, so it is disabled there, explicitly)
#   host        the ubuntu-24.04 runner itself with AppArmor's unprivileged-
#               userns restriction ON, as on an Ubuntu 24.04 desktop: proves
#               the package's AppArmor profile and runs with the sandbox ENABLED
#
# Wayland checks are NON-BLOCKING until their first green run on a hosted
# runner (weston in containers is unvalidated): then set WAYLAND_SEVERITY to
# error. Everything else is blocking. The Python essentials install needs a
# click on the setup screen, so it is not exercised here.
# ═════════════════════════════════════════════════════════════════════════════
  verify-deb:
    name: .deb on ${{ matrix.base }}
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: ubuntu:22.04
          - base: debian:12
          - base: ubuntu:24.04
            selftests: true
          - base: debian:13
            lint: true
          - base: ubuntu:26.04
          - base: host
    env:
      BASE: ${{ matrix.base }}
      SELFTESTS: ${{ matrix.selftests && '1' || '0' }}
      WAYLAND_SEVERITY: warning

    steps:
      - name: Checkout the shared self-test runner
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/ci_app_checks.sh
          sparse-checkout-cone-mode: false

      - name: Download the .deb
        uses: actions/download-artifact@v8
        with:
          name: FinceptTerminal-Linux-x64-installer
          path: deb

      - name: Install, open and remove the .deb
        run: |
          set -euo pipefail
          DEB_NAME="$(cd deb && ls FinceptTerminal-*-linux-x64.deb)"
          cat >"${RUNNER_TEMP}/deb-check.sh" <<'CHECK'
          #!/bin/bash
          # Runs as root: in a clean container (MODE=container) or on the runner (MODE=host).
          set -uo pipefail
          PKG=fincept-terminal-community
          PREFIX=/opt/fincept-terminal-community
          BIN=/usr/bin/fincept-terminal-community
          LOGS=/tmp/deb-check
          FAIL=0
          export DEBIAN_FRONTEND=noninteractive
          fail() { echo "::error title=.deb on ${BASE}::$*"; FAIL=1; }
          warn() { echo "::warning title=.deb on ${BASE}::$*"; }
          report() { if [ "$1" = warning ]; then warn "$2"; else fail "$2"; fi; }
          rm -rf "${LOGS}"; mkdir -p "${LOGS}"
          # Start-up errors that fail a run: platform plugin, TLS backend, WebEngine
          # sandbox / zygote / ICU / resources, SQLite driver, format-string bugs,
          # Python-setup path errors, any FATAL / CRITICAL.
          BAD_RE='Could not load the Qt platform plugin|no Qt platform plugin could be initialized|Failed to load libssl|Failed to load libcrypto|No functional TLS backend|TLS initialization failed|QSslSocket: cannot resolve|Incompatible version of OpenSSL|No usable sandbox|zygote_host_impl|Failed to move to new namespace|sandbox_linux|Running as root without --no-sandbox|ICU data not found|Invalid file descriptor to ICU data|WebEngine resources not found|Error loading V8 startup snapshot|locales directory not found|Could not find QtWebEngineProcess|QSQLITE driver not loaded|Driver not loaded|QString::arg: Argument missing|Requirements file not found|musl libc detected|\bFATAL\b|\bCRITICAL\b'

          echo "::group::apt-get install ./$(basename "${DEB}") (Depends only, no Recommends)"
          apt-get update -qq || { fail "apt-get update failed"; exit 1; }
          if ! apt-get install -y --no-install-recommends "${DEB}"; then
            fail "apt-get install failed: the package's Depends do not resolve on ${BASE}"; exit 1
          fi
          dpkg-query -W -f='${Package} ${Version} ${Installed-Size} KiB\nDepends: ${Depends}\n' "${PKG}"
          echo "::endgroup::"

          echo "::group::Package contents, ownership and modes"
          [ "$(readlink -f "${BIN}")" = "${PREFIX}/bin/FinceptTerminal" ] || fail "${BIN} does not resolve to ${PREFIX}/bin/FinceptTerminal"
          LIST="$(dpkg-query -L "${PKG}")"
          if printf '%s\n' "${LIST}" | grep -E '^/opt/fincept-terminal(/|$)|^/usr/bin/fincept-terminal$|/fincept-terminal\.(desktop|appdata\.xml|png)$'; then
            fail "the package ships a path of the private build's fincept-terminal package"
          fi
          if printf '%s\n' "${LIST}" | grep -x /usr/bin/yt-dlp; then fail "the package ships /usr/bin/yt-dlp, which collides with the distro's yt-dlp (#415)"; fi
          bad="$(find "${PREFIX}" /usr/share/applications/${PKG}.desktop /usr/share/icons/hicolor/*/apps/${PKG}.png \
                   \( ! -type l -perm -0002 \) -o -perm /6000 -o ! -user root -o ! -group root 2>/dev/null | head -n 20)"
          [ -z "${bad}" ] || fail "world-writable, setuid/setgid or not root:root: ${bad}"
          for x in bin/FinceptTerminal bin/yt-dlp libexec/QtWebEngineProcess; do
            [ -x "${PREFIX}/${x}" ] || fail "${PREFIX}/${x} is missing or not executable"
          done
          DESKTOP="/usr/share/applications/${PKG}.desktop"
          EXEC="$(sed -n 's/^Exec=//p' "${DESKTOP}" | head -n 1)"
          case "${EXEC}" in /*) [ -x "${EXEC%% *}" ] || fail "desktop Exec ${EXEC} is not executable" ;; *) fail "desktop Exec '${EXEC}' is not an absolute path" ;; esac
          ICON="$(sed -n 's/^Icon=//p' "${DESKTOP}" | head -n 1)"
          for s in 16 24 32 48 64 128 256; do
            [ -f "/usr/share/icons/hicolor/${s}x${s}/apps/${ICON}.png" ] || fail "icon ${s}x${s}/apps/${ICON}.png is missing"
          done
          [ -f /usr/share/metainfo/com.fincept.terminal.community.metainfo.xml ] || fail "AppStream metainfo is missing"
          echo "::endgroup::"

          echo "::group::Every ELF resolves on ${BASE} with LD_LIBRARY_PATH unset"
          n=0
          while IFS= read -r -d '' f; do
            [ "$(head -c 4 "${f}" | od -An -tx1 | tr -d ' \n')" = 7f454c46 ] || continue
            n=$((n + 1))
            out="$(env -u LD_LIBRARY_PATH ldd "${f}" 2>&1)"
            printf '%s\n' "${out}" | grep 'not found' | sed "s|^|${f}: |" >>"${LOGS}/ldd-missing"
            printf '%s\n' "${out}" | grep -E '^[[:space:]]*libQt6[^ ]* => ' | grep -v "=> ${PREFIX}/" | sed "s|^|${f}: |" >>"${LOGS}/qt-leak"
          done < <(find "${PREFIX}" -type f -print0)
          echo "${n} ELF files checked"
          if [ -s "${LOGS}/ldd-missing" ]; then sort -u "${LOGS}/ldd-missing" | head -n 50; fail "unresolved libraries or symbol versions on ${BASE} (above)"; fi
          if [ -s "${LOGS}/qt-leak" ]; then sort -u "${LOGS}/qt-leak" | head -n 20; fail "Qt libraries resolve from outside ${PREFIX}"; fi
          echo "::endgroup::"

          echo "::group::Test tools and a fresh non-root user (installed after the checks above)"
          TOOLS="xvfb weston dbus"
          # Newer bases split dbus-run-session's session config out of "dbus".
          for p in dbus-session-bus-common dbus-daemon; do
            apt-cache show "${p}" >/dev/null 2>&1 && TOOLS="${TOOLS} ${p}"
          done
          apt-get install -y -qq --no-install-recommends ${TOOLS} >/dev/null || { fail "could not install the test tools (${TOOLS})"; exit 1; }
          # A plain X server for every X11 run (owned by root, so kill_tester leaves it up).
          install -d -m 1777 /tmp/.X11-unix
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac >"${LOGS}/xvfb.log" 2>&1 &
          XVFB_PID=$!
          for _ in $(seq 1 30); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          [ -S /tmp/.X11-unix/X99 ] || { cat "${LOGS}/xvfb.log"; fail "Xvfb did not start"; exit 1; }
          dbus-uuidgen --ensure=/etc/machine-id >/dev/null 2>&1 || true
          dbus-uuidgen --ensure >/dev/null 2>&1 || true
          id tester >/dev/null 2>&1 || useradd -m -s /bin/bash tester
          TUID="$(id -u tester)"
          XRT=/tmp/xdg-tester
          rm -rf "${XRT}"; install -d -m 700 -o tester -g tester "${XRT}"
          install -m 644 "${CI_CHECKS}" /tmp/ci_app_checks.sh
          # GPU-less CI; in a container the Chromium sandbox cannot create user
          # namespaces, so it is disabled there (the host leg runs it enabled).
          APP_ENV=(QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu)
          [ "${MODE}" = host ] || APP_ENV+=(QTWEBENGINE_DISABLE_SANDBOX=1)
          as_tester() {
            runuser -u tester -- env -i HOME=/home/tester USER=tester LOGNAME=tester SHELL=/bin/bash \
              PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 XDG_RUNTIME_DIR="${XRT}" "${APP_ENV[@]}" "$@"
          }
          kill_tester() {
            local d
            for d in /proc/[0-9]*; do
              [ "$(stat -c %u "${d}" 2>/dev/null)" = "${TUID}" ] && kill -KILL "${d#/proc/}" 2>/dev/null
            done
            sleep 1
          }
          app_log() { find /home/tester -path "*/profiles/$1/logs/fincept.log" 2>/dev/null | head -n 1; }
          # $1 severity, $2 label, $3 profile ("" = the only log), $4 platform, $5 program output.
          check_run() {
            local sev="$1" label="$2" log hits
            if [ -n "$3" ]; then log="$(app_log "$3")"; else log="$(find /home/tester -name fincept.log 2>/dev/null | head -n 1)"; fi
            if [ -z "${log}" ]; then report "${sev}" "${label}: no fincept.log was written — the terminal did not start"; return; fi
            grep -aq "Qt platform: $4" "${log}" || report "${sev}" "${label}: fincept.log does not report 'Qt platform: $4'"
            grep -aq 'Fincept Terminal starting .*tls=openssl' "${log}" \
              || report "${sev}" "${label}: TLS backend is not OpenSSL ($(grep -a 'Fincept Terminal starting' "${log}" | tail -n 1))"
            hits="$(grep -ahE "${BAD_RE}" "$5" "${log}" | head -n 20)"
            if [ -n "${hits}" ]; then printf '%s\n' "${hits}"; report "${sev}" "${label}: start-up errors in the output or fincept.log (above)"; fi
          }
          as_tester "${PREFIX}/bin/yt-dlp" --version || fail "the bundled yt-dlp does not run"
          echo "::endgroup::"

          if [ "${MODE}" = host ]; then
            echo "::group::AppArmor: unprivileged user namespaces restricted, as on Ubuntu 24.04 desktops"
            if [ -w /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              echo 1 >/proc/sys/kernel/apparmor_restrict_unprivileged_userns
              echo "kernel.apparmor_restrict_unprivileged_userns=1"
            else
              warn "this kernel has no userns restriction: the AppArmor profile is not exercised"
            fi
            if [ -e /sys/kernel/security/apparmor/profiles ]; then
              grep "^${PKG}" /sys/kernel/security/apparmor/profiles || fail "the package's AppArmor profile is not loaded after install (postinst)"
            fi
            echo "::endgroup::"
          fi

          echo "::group::First start from the desktop entry (X11, fresh HOME: setup screen expected)"
          as_tester env DISPLAY=:99 QT_QPA_PLATFORM=xcb dbus-run-session -- \
            timeout -s TERM -k 10 45 ${EXEC} >"${LOGS}/first.out" 2>&1
          st=$?
          tail -n 60 "${LOGS}/first.out"
          kill_tester
          [ "${st}" -eq 124 ] || fail "first start: the terminal exited after less than 45 s (status ${st}) instead of showing the setup screen"
          grep -aq 'showing setup screen' "$(find /home/tester -name fincept.log | head -n 1)" 2>/dev/null \
            || fail "first start: fincept.log does not say the setup screen was shown"
          check_run error "first start (X11)" "" xcb "${LOGS}/first.out"
          echo "::endgroup::"

          echo "::group::Screen walk on X11 (Xvfb, QT_QPA_PLATFORM=xcb)"
          # Samples the environment of every process the terminal starts: no
          # library or plugin path may reach them (they would break the managed
          # Python and other programs), and records the WebEngine processes.
          ( while :; do
              for d in /proc/[0-9]*; do
                [ "$(stat -c %u "${d}" 2>/dev/null)" = "${TUID}" ] || continue
                cmd="$(tr '\0' ' ' <"${d}/cmdline" 2>/dev/null | cut -c1-160)"
                case "${cmd}" in *QtWebEngineProcess*) echo "${cmd}" >>"${LOGS}/webengine-procs" ;; esac
                tr '\0' '\n' <"${d}/environ" 2>/dev/null \
                  | grep -E '^(LD_LIBRARY_PATH|LD_PRELOAD|QT_PLUGIN_PATH|QT_QPA_PLATFORM_PLUGIN_PATH|QML2_IMPORT_PATH)=' \
                  | sed "s|^|${cmd%% *}: |" >>"${LOGS}/env-leaks"
              done
              sleep 1
            done ) &
          SAMPLER=$!
          as_tester env DISPLAY=:99 QT_QPA_PLATFORM=xcb dbus-run-session -- \
            timeout -k 10 600 "${BIN}" --smoke-test --profile ci-xcb >"${LOGS}/xcb.out" 2>&1
          st=$?
          kill "${SAMPLER}" 2>/dev/null; wait "${SAMPLER}" 2>/dev/null
          tail -n 120 "${LOGS}/xcb.out"
          kill_tester
          [ "${st}" -eq 0 ] || fail "X11 screen walk exited with ${st} (124 = hung); the last '[Smoke] >>> constructing' line names the screen"
          grep -aq '\[Smoke\] OK:' "${LOGS}/xcb.out" || fail "X11 screen walk printed no '[Smoke] OK:' line"
          check_run error "X11 screen walk" ci-xcb xcb "${LOGS}/xcb.out"
          if [ -s "${LOGS}/env-leaks" ]; then sort -u "${LOGS}/env-leaks" | head -n 20; fail "library / plugin path variables reach processes the terminal starts (above)"; fi
          echo "QtWebEngine processes seen: $(sort -u "${LOGS}/webengine-procs" 2>/dev/null | wc -l)"
          if [ "${MODE}" = host ] && ! grep -q -- '--type=renderer' "${LOGS}/webengine-procs" 2>/dev/null; then
            warn "no QtWebEngine renderer started during the walk, so the sandbox was not exercised"
          fi
          echo "::endgroup::"

          if [ "${SELFTESTS}" = 1 ]; then
            echo "::group::Self-tests on the installed package"
            as_tester env DISPLAY=:99 QT_QPA_PLATFORM=xcb dbus-run-session -- \
              bash /tmp/ci_app_checks.sh selftests "${BIN}" ci-selftests \
              || fail "self-tests failed on the installed package"
            kill_tester
            echo "::endgroup::"
          fi

          echo "::group::Wayland (headless weston, no X server)"
          WSOCK=wl-ci
          WPID=""
          for backend in headless-backend.so headless; do
            as_tester weston --backend="${backend}" --socket="${WSOCK}" --no-config >"${LOGS}/weston-${backend}.log" 2>&1 &
            WPID=$!
            for _ in $(seq 1 30); do
              [ -S "${XRT}/${WSOCK}" ] && break
              kill -0 "${WPID}" 2>/dev/null || break
              sleep 0.5
            done
            [ -S "${XRT}/${WSOCK}" ] && break
            kill "${WPID}" 2>/dev/null; wait "${WPID}" 2>/dev/null; WPID=""
          done
          if [ -z "${WPID}" ]; then
            cat "${LOGS}"/weston-*.log 2>/dev/null | tail -n 30
            report "${WAYLAND_SEVERITY}" "could not start a headless weston: the Wayland checks did not run"
          else
            as_tester env WAYLAND_DISPLAY="${WSOCK}" QT_QPA_PLATFORM=wayland dbus-run-session -- \
              timeout -k 10 600 "${BIN}" --smoke-test --profile ci-wayland >"${LOGS}/wayland.out" 2>&1
            st=$?
            tail -n 80 "${LOGS}/wayland.out"
            [ "${st}" -eq 0 ] && grep -aq '\[Smoke\] OK:' "${LOGS}/wayland.out" \
              || report "${WAYLAND_SEVERITY}" "Wayland screen walk failed (status ${st}, 124 = hung)"
            check_run "${WAYLAND_SEVERITY}" "Wayland screen walk" ci-wayland wayland "${LOGS}/wayland.out"
            # QT_QPA_PLATFORM unset and no DISPLAY: the v4.5.2 abort case.
            as_tester env WAYLAND_DISPLAY="${WSOCK}" XDG_SESSION_TYPE=wayland dbus-run-session -- \
              timeout -s TERM -k 10 45 "${BIN}" --profile ci-wayland-start >"${LOGS}/wayland-start.out" 2>&1
            st=$?
            tail -n 40 "${LOGS}/wayland-start.out"
            [ "${st}" -eq 124 ] || report "${WAYLAND_SEVERITY}" "Wayland start without X: exited after less than 45 s (status ${st})"
            check_run "${WAYLAND_SEVERITY}" "Wayland start without X" ci-wayland-start wayland "${LOGS}/wayland-start.out"
          fi
          kill_tester
          echo "::endgroup::"

          echo "::group::apt-get remove, then purge"
          apt-get remove -y "${PKG}" || fail "apt-get remove failed"
          for p in "${PREFIX}" "${BIN}" "/usr/share/applications/${PKG}.desktop" \
                   /usr/share/metainfo/com.fincept.terminal.community.metainfo.xml "/etc/apparmor.d/${PKG}"; do
            if [ -e "${p}" ] || [ -L "${p}" ]; then fail "${p} is left after apt-get remove"; fi
          done
          if grep -q "^${PKG}" /sys/kernel/security/apparmor/profiles 2>/dev/null; then fail "the AppArmor profile is still loaded after remove"; fi
          apt-get purge -y "${PKG}" || fail "apt-get purge failed"
          if dpkg-query -W -f='${db:Status-Abbrev}' "${PKG}" 2>/dev/null | grep -q '^[ir]'; then fail "dpkg still lists ${PKG} after purge"; fi
          left="$(find /opt /usr/bin /usr/share /etc /var/lib/dpkg/info /var/cache/apparmor -iname '*fincept*' 2>/dev/null)"
          if [ -n "${left}" ]; then printf '%s\n' "${left}"; fail "files left outside the user's home after purge (above)"; fi
          [ -d /home/tester/.local/share ] && echo "user data in /home/tester is kept, as it must be"
          echo "::endgroup::"
          kill "${XVFB_PID}" 2>/dev/null
          exit "${FAIL}"
          CHECK
          if [ "${BASE}" = host ]; then
            sudo env BASE="${BASE}" MODE=host SELFTESTS="${SELFTESTS}" WAYLAND_SEVERITY="${WAYLAND_SEVERITY}" \
              DEB="${GITHUB_WORKSPACE}/deb/${DEB_NAME}" CI_CHECKS="${GITHUB_WORKSPACE}/.github/scripts/ci_app_checks.sh" \
              bash "${RUNNER_TEMP}/deb-check.sh"
          else
            docker run --rm --shm-size=1g \
              -v "${GITHUB_WORKSPACE}:/w:ro" -v "${RUNNER_TEMP}/deb-check.sh:/deb-check.sh:ro" \
              -e BASE -e MODE=container -e SELFTESTS -e WAYLAND_SEVERITY \
              -e DEB="/w/deb/${DEB_NAME}" -e CI_CHECKS=/w/.github/scripts/ci_app_checks.sh \
              "${BASE}" bash /deb-check.sh
          fi

      # Newest tools (Debian 13): desktop-file-validate, appstreamcli and
      # lintian (errors fail; accepted findings are the package's
      # /usr/share/lintian/overrides file, each with its reason).
      - name: Lint the package
        if: matrix.lint
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/w:ro" debian:13 bash -c '
            set -uo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends lintian desktop-file-utils appstream >/dev/null
            DEB="$(ls /w/deb/FinceptTerminal-*-linux-x64.deb)"
            X="$(mktemp -d)"; dpkg-deb -x "${DEB}" "${X}"
            rc=0
            echo "::group::desktop-file-validate"
            desktop-file-validate "${X}"/usr/share/applications/*.desktop || { echo "::error::desktop-file-validate failed"; rc=1; }
            echo "::endgroup::"
            echo "::group::appstreamcli validate --no-net"
            appstreamcli validate --no-net --explain "${X}"/usr/share/metainfo/*.xml || { echo "::error::appstreamcli validate failed"; rc=1; }
            echo "::endgroup::"
            echo "::group::lintian"
            # alien-tag: the overrides file names tags for every lintian we lint with; a newer
            # lintian (Debian 13) has dropped python-script-but-no-python-dep and reports the
            # override itself as an error. The override must stay for the older releases.
            lintian --fail-on error --suppress-tags alien-tag "${DEB}" || { echo "::error::lintian reported errors"; rc=1; }
            echo "::endgroup::"
            exit "${rc}"'

# ═════════════════════════════════════════════════════════════════════════════
# JOB 3 — macOS arm64 Installer (DMG built with hdiutil)
# ═════════════════════════════════════════════════════════════════════════════
  build-macos:
    name: macOS arm64 Installer
    # A manual run may ask for one Linux package alone; tag pushes carry no
    # inputs and always build everything.
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-arm64-release-${{ env.QT_VERSION }}
          max-size: 500M

      - name: Install build tools
        run: brew install ninja cmake || brew upgrade ninja cmake || true

      # ── Qt ────────────────────────────────────────────────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-macos-arm64-release

      # ── Qt Installer Framework (for the optional wizard installer) ─────────
      - name: Install Qt Installer Framework
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade aqtinstall
          aqt install-tool mac desktop ${{ env.QT_IFW_TOOL }} \
            --outputdir "${{ runner.temp }}/qtifw"
          IFW_DIR="${{ runner.temp }}/qtifw/Tools/QtInstallerFramework/${{ env.QT_IFW_VERSION }}"
          echo "QT_IFW_DIR=${IFW_DIR}" >> "$GITHUB_ENV"
          echo "${IFW_DIR}/bin" >> "$GITHUB_PATH"

      - name: Install Python 3.12
        run: brew install python@3.12 || brew upgrade python@3.12 || true

      # ── Icon ──────────────────────────────────────────────────────────────
      - name: Generate .icns icon
        working-directory: fincept-qt
        run: |
          ICO="resources/fincept.ico"
          ICNS="resources/fincept.icns"
          if [ -f "${ICNS}" ]; then
            echo ".icns already exists"
          elif [ -f "${ICO}" ]; then
            ICONSET="$(mktemp -d)/fincept.iconset"
            mkdir -p "${ICONSET}"
            sips -s format png "${ICO}" --out "${ICONSET}/icon_512x512.png" \
              --resampleHeightWidth 512 512 2>/dev/null
            for size in 16 32 64 128 256; do
              sips -z ${size} ${size} "${ICONSET}/icon_512x512.png" \
                --out "${ICONSET}/icon_${size}x${size}.png" 2>/dev/null
            done
            cp "${ICONSET}/icon_512x512.png" "${ICONSET}/icon_256x256@2x.png"
            sips -z 1024 1024 "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_512x512@2x.png" 2>/dev/null
            sips -z 64  64  "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_32x32@2x.png" 2>/dev/null
            sips -z 32  32  "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_16x16@2x.png" 2>/dev/null
            sips -z 256 256 "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_128x128@2x.png" 2>/dev/null
            iconutil -c icns -o "${ICNS}" "${ICONSET}"
            echo "Generated ${ICNS}"
          else
            echo "WARNING: No source icon — app will use generic icon"
          fi

      # ── yt-dlp (bundled for dashboard video playback) ────────────────────
      - name: Install yt-dlp
        run: pip install yt-dlp

      # ── Strip dangling Qt SQL driver plugin CMake configs (aqt workaround) ──
      # Same aqtinstall defect as the Linux/Windows jobs: Qt6Sql ships
      # *DriverPlugin CMake target files for MySQL/PSQL/ODBC/Mimer but not the
      # plugin dylibs they reference, so find_package(Qt6 ... Sql) aborts at
      # configure time ("references the file .../libqsqlmysql.dylib but this
      # file does not exist"). We only use SQLite — drop the dangling configs.
      - name: Remove dangling Qt SQL driver plugin CMake configs
        run: |
          set -euo pipefail
          SQL_CMAKE="${QT_ROOT_DIR}/lib/cmake/Qt6Sql"
          if [ -d "${SQL_CMAKE}" ]; then
            for drv in QMYSQLDriverPlugin QPSQLDriverPlugin QODBCDriverPlugin QMimerSQLDriverPlugin; do
              rm -fv "${SQL_CMAKE}/Qt6${drv}"*.cmake || true
            done
          else
            echo "::warning::${SQL_CMAKE} not found — skipping SQL plugin config cleanup"
          fi

      # ── Configure + Build ─────────────────────────────────────────────────
      # No FINCEPT_BUILD_INSTALLER on macOS — we ship a DMG built from the
      # post-processed bundle (see "Generate Installer (DMG)" step below).
      - name: Configure CMake
        working-directory: fincept-qt
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFINCEPT_REQUIRE_BUNDLED_YTDLP=ON

      - name: Build
        working-directory: fincept-qt
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.logicalcpu) -- -k 0

      # ── Verify ───────────────────────────────────────────────────────────
      - name: Verify binary
        working-directory: fincept-qt
        run: |
          if [ -f "build/${{ env.APP_NAME }}" ]; then
            BINARY="build/${{ env.APP_NAME }}"
          elif [ -f "build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}" ]; then
            BINARY="build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          else
            echo "::error::Binary not found"
            find build -maxdepth 3 -name "${{ env.APP_NAME }}*" || true
            exit 1
          fi
          echo "Binary: $BINARY ($(du -sh "$BINARY" | cut -f1))"
          lipo -info "$BINARY"

      # ── Headless self-tests (build-tree binary) ───────────────────────────
      # Runs before staging/macdeployqt/codesign so a logic regression fails
      # in ~2 minutes rather than after the notarization round-trip. The
      # signed-bundle launch check is a separate step after stapling.
      - name: Run self-tests (headless)
        working-directory: fincept-qt
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ -f "build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}" ]; then
            BINARY="build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          else
            BINARY="build/${{ env.APP_NAME }}"
          fi
          bash ../.github/scripts/ci_app_checks.sh selftests "$BINARY" ci

      # A self-test that dies with a signal prints nothing useful ("Trace/BPT trap: 5"). When
      # the step above fails, show the crashed thread of every crash report macOS wrote, so the
      # failing function is in this run's log instead of needing a second, diagnostic run.
      - name: Crash reports (on self-test failure)
        if: failure()
        shell: bash
        run: |
          sleep 30
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          python3 .github/scripts/crash_report_summary.py || true

      # ── Stage .app bundle contents (Python + resources FIRST) ─────────────
      # Order is critical: Python.framework and resources must be in the bundle
      # BEFORE macdeployqt / codesign run. If we embed after signing, dyld on
      # macOS 14+ kills the process with SIGKILL (Code Signature Invalid)
      # because the added framework pages have no signature. See issue #139.
      - name: Stage .app bundle contents
        working-directory: fincept-qt
        run: |
          set -euxo pipefail
          BUILD_DIR="build"

          if [ -d "${BUILD_DIR}/${{ env.APP_NAME }}.app" ]; then
            APP_BUNDLE="${BUILD_DIR}/${{ env.APP_NAME }}.app"
          else
            APP_BUNDLE="${BUILD_DIR}/${{ env.APP_NAME }}.app"
            mkdir -p "${APP_BUNDLE}/Contents/MacOS"
            cp "${BUILD_DIR}/${{ env.APP_NAME }}" "${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
            chmod +x "${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
            # Version MUST come from CMakeLists.txt, not a literal: this
            # fallback plist used to hardcode 4.3.0, so on the fallback path
            # the bundle advertised a CFBundleVersion that disagreed with the
            # binary as soon as the project version moved, so macOS showed a
            # different version than the app reports (and than the update
            # manifest names). Note the heredoc delimiter is
            # unquoted (<<PLIST, not <<'PLIST') so ${VERSION} interpolates.
            VERSION=$(grep -Eo 'project\(FinceptTerminal VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
            [ -n "${VERSION}" ] || { echo "::error::Could not parse VERSION from CMakeLists.txt"; exit 1; }
            cat > "${APP_BUNDLE}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>FinceptTerminal</string>
            <key>CFBundleIdentifier</key><string>com.fincept.terminal.community</string>
            <key>CFBundleName</key><string>FinceptTerminal</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          fi

          # CMake's POST_BUILD rule copies scripts/ + resources/ + yt-dlp
          # into Contents/MacOS/ (portable layout for Linux/Windows builds).
          # On macOS that's not the canonical .app layout and codesign
          # refuses to sign any bundle with non-Mach-Os in Contents/MacOS/,
          # so the "Canonicalise bundle layout" block further down in this
          # step moves them into Contents/Resources/ before signing.
          # PythonRunner::find_scripts_dir(),
          # PythonSetupManager::find_requirements_file(), and
          # VideoPlayerWidget::resolve_ytdlp_program() each carry an
          # `../Resources/...` candidate so the C++ side picks up the new
          # location after the move.

          # Embed Python.framework before codesign so it's signed as part of
          # the bundle. We use `rsync -a` (not `ditto`) because ditto under
          # non-root breaks Versions/Current symlinks inside nested
          # Tcl.framework / Tk.framework, which then makes codesign reject the
          # bundle with "embedded framework contains modified or invalid
          # version" (issue #191). The symlink layer is rebuilt explicitly
          # below.
          # Version is pinned to match the C++ build target. Must stay in
          # sync with PythonRunner / PythonSetupManager in src/python/.
          PY_VER_KEEP="3.12"

          # Prefer the Homebrew-installed framework: on a fresh pour it holds
          # exactly Versions/${PY_VER_KEEP} + Current, avoiding the multi-
          # version mess that /Library/Frameworks/Python.framework carries on
          # the macos-15-arm64 runner image (3.11/3.12/3.13/3.14 side-by-side).
          # The extra-version pruning below is still done as a safety net.
          PY_FRAMEWORK=""
          for candidate in \
            "$(brew --prefix python@3.12 2>/dev/null)/Frameworks/Python.framework" \
            "/Library/Frameworks/Python.framework" \
            "$(brew --prefix python3 2>/dev/null)/Frameworks/Python.framework"; do
            [ -d "${candidate}/Versions" ] && { PY_FRAMEWORK="${candidate}"; break; }
          done

          BUNDLE_FRAMEWORKS="${APP_BUNDLE}/Contents/Frameworks"
          mkdir -p "${BUNDLE_FRAMEWORKS}"

          if [ -z "${PY_FRAMEWORK}" ]; then
            echo "::warning::Python.framework not found — skipping embed step"
          else
            echo "Embedding Python.framework from: ${PY_FRAMEWORK}"
            PYFW="${BUNDLE_FRAMEWORKS}/Python.framework"
            rm -rf "${PYFW}"

            # rsync -a == -rlptgoD; -l preserves symlinks as symlinks. The
            # trailing slash on the source copies contents into the target
            # directory. --safe-links would skip symlinks that point outside
            # the source tree, which we want (dangling nested symlinks are
            # cleaned separately below).
            rsync -a "${PY_FRAMEWORK}/" "${PYFW}/"

            # Strip every Python version except the one we ship. The
            # macos-15-arm64 runner image preinstalls
            # /Library/Frameworks/Python.framework with 3.11, 3.12, 3.13 and
            # 3.14 side-by-side. Leaving more than one version inside the
            # bundled framework trips `codesign --verify --strict` with
            # "embedded framework contains modified or invalid version" —
            # Apple's framework format expects exactly one active version
            # plus Versions/Current. This must run BEFORE
            # fix_framework_symlinks, otherwise Current could point at a
            # version we are about to delete.
            if [ ! -d "${PYFW}/Versions/${PY_VER_KEEP}" ]; then
              echo "::error::Expected Python ${PY_VER_KEEP} under ${PYFW}/Versions/, found:"
              ls -la "${PYFW}/Versions/" || true
              exit 1
            fi
            for v in "${PYFW}/Versions/"*; do
              name="$(basename "$v")"
              [ "$name" = "Current" ] && continue
              [ "$name" = "${PY_VER_KEEP}" ] && continue
              [ -d "$v" ] || continue
              echo "Pruning extra Python version from bundle: ${name}"
              rm -rf "$v"
            done
            PY_VER="${PY_VER_KEEP}"
            echo "Python framework version (kept): ${PY_VER}"

            # Helper: rebuild the framework symlink layer for a framework dir.
            # $1 = path to .framework; $2 = concrete version string inside
            # Versions/. Rebuilds Versions/Current and the top-level name /
            # Resources / Headers symlinks. Uses relative targets so the
            # framework is relocatable.
            fix_framework_symlinks() {
              local fw="$1" ver="$2"
              local fw_name
              fw_name="$(basename "$fw" .framework)"
              [ -d "${fw}/Versions/${ver}" ] || { echo "skip ${fw}: Versions/${ver} missing"; return 0; }
              ( cd "${fw}/Versions" && rm -f Current && ln -s "${ver}" Current )
              for link in "${fw_name}" Resources Headers; do
                local target="Versions/Current/${link}"
                if [ -e "${fw}/${target}" ] || [ -L "${fw}/${target}" ]; then
                  ( cd "${fw}" && rm -f "${link}" && ln -s "${target}" "${link}" )
                fi
              done
            }

            # Fix Python.framework itself
            fix_framework_symlinks "${PYFW}" "${PY_VER}"

            # Fix any nested frameworks inside Python (Tcl, Tk, and anything
            # else Homebrew ships). Codesign walks into these, and a broken
            # symlink layer here is what produced the "modified or invalid
            # version" error on the runner.
            NESTED_ROOT="${PYFW}/Versions/${PY_VER}/Frameworks"
            if [ -d "${NESTED_ROOT}" ]; then
              for nested_fw in "${NESTED_ROOT}"/*.framework; do
                [ -d "${nested_fw}" ] || continue
                nested_ver=""
                if [ -d "${nested_fw}/Versions" ]; then
                  for v in "${nested_fw}/Versions/"*; do
                    name="$(basename "$v")"
                    [ "$name" = "Current" ] && continue
                    [ -d "$v" ] || continue
                    nested_ver="$name"
                    break
                  done
                fi
                [ -n "${nested_ver}" ] || { echo "skip ${nested_fw}: no version dir"; continue; }
                fix_framework_symlinks "${nested_fw}" "${nested_ver}"
              done
            fi

            # Strip dev-only files that shouldn't ship AND confuse codesign:
            #   - .pyc / .pyo caches (regenerated at runtime, stale hashes fail seal)
            #   - __pycache__ directories
            # Run AFTER the symlink fix — otherwise find could race the rebuild.
            find "${PYFW}" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
            find "${PYFW}" -name "*.pyc" -delete 2>/dev/null || true
            find "${PYFW}" -name "*.pyo" -delete 2>/dev/null || true

            # Remove dangling symlinks (e.g. Homebrew's PrivateHeaders often
            # points to missing targets). `-exec test -e` resolves through
            # symlinks, so a broken link matches `! -exec test -e`.
            find "${PYFW}" -type l ! -exec test -e {} \; -delete 2>/dev/null || true

            # Strip quarantine and extended attributes from the framework.
            # Leftover com.apple.quarantine or com.apple.provenance xattrs on
            # individual pages invalidate the ad-hoc signature when the DMG
            # is copied to /Applications on macOS 14+ Apple Silicon — this is
            # the root cause behind the SIGKILL "Code Signature Invalid"
            # reports in issues #139, #173, #191.
            xattr -cr "${PYFW}" 2>/dev/null || true

            # Convenience symlink the C++ runtime uses to invoke the embedded
            # python binary. Kept from the original block.
            ln -sf "../Frameworks/Python.framework/Versions/${PY_VER}/bin/python${PY_VER}" \
                   "${APP_BUNDLE}/Contents/MacOS/python3" 2>/dev/null || true
            echo "Python ${PY_VER} embedded"

            # Sanity-check every framework that codesign will walk into.
            # Fail fast with a clear error here rather than blowing up 30
            # seconds later inside `codesign --verify`.
            for check_fw in "${PYFW}" "${NESTED_ROOT}"/*.framework; do
              [ -d "${check_fw}" ] || continue
              if [ ! -L "${check_fw}/Versions/Current" ]; then
                echo "::error::${check_fw}/Versions/Current is not a symlink — codesign will reject"
                ls -la "${check_fw}/Versions/" || true
                exit 1
              fi
            done
            echo "Python.framework structure OK"
          fi

          # Top-level Resources/ for icons (Info.plist's CFBundleIconFile
          # is read from here).
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          cp -r resources "${APP_BUNDLE}/Contents/Resources/" 2>/dev/null || true

          # ── Canonicalise bundle layout for codesign ──────────────────────
          # CMake's POST_BUILD steps copy scripts/, resources/, and yt-dlp
          # into Contents/MacOS/ (alongside the binary), which is portable
          # to Linux/Windows where there's no .app bundle. On macOS that
          # layout is FATAL for codesign: anything in Contents/MacOS/ that
          # isn't a Mach-O makes codesign reject the bundle with
          #   "code object is not signed at all
          #    In subcomponent: .../Contents/MacOS/<...>"
          # So we relocate the offending paths into Contents/Resources/
          # before signing. PythonRunner / PythonSetupManager /
          # VideoPlayerWidget all have `../Resources/...` in their
          # candidate search lists, so the C++ side keeps working.
          echo "Canonicalising bundle layout (moving non-Mach-O content out of MacOS/)..."

          # scripts/ → Contents/Resources/scripts/  (preserve dir name)
          if [ -d "${APP_BUNDLE}/Contents/MacOS/scripts" ]; then
              rm -rf "${APP_BUNDLE}/Contents/Resources/scripts"
              mv "${APP_BUNDLE}/Contents/MacOS/scripts" \
                 "${APP_BUNDLE}/Contents/Resources/scripts"
              echo "  moved Contents/MacOS/scripts → Contents/Resources/scripts"
          fi

          # MacOS/resources/* → Contents/Resources/  (FLATTEN — PythonSetupManager
          # searches `../Resources/<filename>`, not `../Resources/resources/...`).
          if [ -d "${APP_BUNDLE}/Contents/MacOS/resources" ]; then
              rsync -a "${APP_BUNDLE}/Contents/MacOS/resources/" \
                       "${APP_BUNDLE}/Contents/Resources/"
              rm -rf "${APP_BUNDLE}/Contents/MacOS/resources"
              echo "  merged Contents/MacOS/resources/* → Contents/Resources/"
          fi

          # yt-dlp → Contents/Resources/yt-dlp
          if [ -f "${APP_BUNDLE}/Contents/MacOS/yt-dlp" ]; then
              mv "${APP_BUNDLE}/Contents/MacOS/yt-dlp" \
                 "${APP_BUNDLE}/Contents/Resources/yt-dlp"
              echo "  moved Contents/MacOS/yt-dlp → Contents/Resources/yt-dlp"
          fi

          echo "Bundle staged at: ${APP_BUNDLE}"
          echo "Pre-sign size: $(du -sh "${APP_BUNDLE}" | cut -f1)"
          echo "=== Contents/MacOS/ top level (should be Mach-Os only) ==="
          ls -la "${APP_BUNDLE}/Contents/MacOS/" | head -10
          echo "=== Scripts count under Contents/Resources/scripts ==="
          find "${APP_BUNDLE}/Contents/Resources/scripts" -type f 2>/dev/null | wc -l || true

      # ── Run macdeployqt on the fully staged bundle ────────────────────────
      # macdeployqt copies Qt frameworks, fixes rpaths, and signs everything
      # it touches. It must run AFTER Python.framework + resources are in place
      # so those get correct rpath treatment.
      - name: Run macdeployqt
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"
          MACDEPLOYQT="${QT_ROOT_DIR}/bin/macdeployqt"
          if [ -x "${MACDEPLOYQT}" ]; then
            echo "Running macdeployqt on ${APP_BUNDLE}"
            # -always-overwrite keeps incremental runs idempotent on local
            # re-runs without affecting CI (which always starts clean).
            "${MACDEPLOYQT}" "${APP_BUNDLE}" -verbose=1 -always-overwrite || \
              echo "::warning::macdeployqt exited non-zero — continuing to explicit codesign"
          else
            echo "::error::macdeployqt not found at ${MACDEPLOYQT} — bundle will be missing Qt frameworks"
            exit 1
          fi

          # Belt-and-suspenders: if any linked dylib is still pointing outside
          # the bundle (e.g. @rpath to /Users/runner/work/... or /opt/homebrew),
          # the app will crash on any other machine. Copy every non-system
          # non-bundled dylib into Frameworks/ and rewrite its install name.
          FRAMEWORKS="${APP_BUNDLE}/Contents/Frameworks"
          MAIN_BIN="${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
          mkdir -p "${FRAMEWORKS}"

          # Walk every Mach-O inside the bundle. For each, inspect its linked
          # libraries; if any resolve to a path that isn't a system location
          # (/usr/lib, /System) and isn't already inside the bundle, copy it
          # in and rewrite the link with install_name_tool.
          bundle_external_deps() {
            local target="$1"
            otool -L "$target" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*|@executable_path/*|@loader_path/*|@rpath/*) ;;
                "") ;;
                *)
                  if [ -f "$dep" ]; then
                    base=$(basename "$dep")
                    if [ ! -f "${FRAMEWORKS}/${base}" ]; then
                      cp "$dep" "${FRAMEWORKS}/"
                      chmod u+w "${FRAMEWORKS}/${base}"
                      install_name_tool -id "@rpath/${base}" "${FRAMEWORKS}/${base}" 2>/dev/null || true
                      echo "Bundled missing dep: ${base}"
                    fi
                    install_name_tool -change "$dep" "@rpath/${base}" "$target" 2>/dev/null || true
                  fi
                  ;;
              esac
            done
          }

          # Main binary + every dylib in Frameworks
          bundle_external_deps "${MAIN_BIN}"
          find "${FRAMEWORKS}" -name "*.dylib" -type f 2>/dev/null | while read -r dylib; do
            bundle_external_deps "$dylib"
          done

          # Verify no un-bundled non-system deps remain.
          LEAKS=$(otool -L "${MAIN_BIN}" 2>/dev/null | tail -n +2 | awk '{print $1}' | \
            grep -vE '^(/usr/lib|/System|@executable_path|@loader_path|@rpath)' | \
            grep -v '^$' || true)
          if [ -n "${LEAKS}" ]; then
            echo "::warning::Main binary still references external paths:"
            echo "${LEAKS}"
          else
            echo "Main binary: no external path references"
          fi

          echo "=== Bundle Frameworks/ contents ==="
          ls -la "${FRAMEWORKS}" | head -50

          # ── Thin universal Mach-Os to arm64 ─────────────────────────────────
          # jurplel/install-qt-action@v4 / aqtinstall ships Qt 6.x macOS as a
          # universal (arm64+x86_64) binary — Qt 6.2+ only publishes one macOS
          # archive labelled `clang_64` that contains both slices fused with
          # lipo. macdeployqt copies those frameworks/plugins into the bundle
          # untouched, which leaves ~36 fat Mach-Os in Contents/Frameworks/
          # and Contents/PlugIns/ while the app binary itself was built
          # arm64-only via -DCMAKE_OSX_ARCHITECTURES=arm64.
          #
          # The pre-flight architecture check below requires exactly one
          # arm64 slice per Mach-O (we ship an arm64-only DMG), so we walk
          # every Mach-O and strip x86_64 with `lipo -thin arm64`. Must run
          # BEFORE codesign — any signature applied before thinning is
          # invalidated the moment we rewrite the file.
          echo "Thinning universal Mach-Os to arm64..."
          THINNED_COUNT=0
          while IFS= read -r f; do
            file -h "$f" 2>/dev/null | grep -q "Mach-O" || continue
            # Skip if already single-arch (saves a fork+exec per file).
            ARCHS=$(file -h "$f" 2>/dev/null | grep -oE "(arm64|x86_64|i386|ppc)" | sort -u | tr '\n' ',' | sed 's/,$//')
            [ "${ARCHS}" = "arm64" ] && continue
            # Skip files with no arm64 slice at all (shouldn't happen for
            # Qt's universal build, but guard against surprises in third-
            # party dylibs that bundle_external_deps may have pulled in).
            if ! echo "${ARCHS}" | grep -q "arm64"; then
              echo "::warning::no arm64 slice in $f (archs: ${ARCHS}) — leaving as-is"
              continue
            fi
            chmod u+w "$f" 2>/dev/null || true
            if lipo -thin arm64 "$f" -output "$f" 2>/dev/null; then
              THINNED_COUNT=$((THINNED_COUNT + 1))
            else
              echo "::warning::lipo -thin arm64 failed for $f"
            fi
          done < <(find "${APP_BUNDLE}" -type f 2>/dev/null)
          echo "  thinned ${THINNED_COUNT} Mach-O(s) to arm64"

      # ── Import Developer ID certificate into a temp keychain ──────────────
      # The cert + private key live in repo secrets (base64-encoded .p12).
      # We provision a throwaway keychain for this job so the runner's
      # default login keychain stays untouched and the cert is gone the
      # moment the job ends.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          P12_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 -d > "$P12_PATH"
          security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$P12_PATH"

          # `security find-identity` EXITS 0 while printing "0 valid identities
          # found", so calling it bare proved nothing: an expired certificate or
          # a rotated MACOS_SIGNING_IDENTITY sailed through this step and died
          # ~35 minutes later inside the codesign step as an opaque
          # "Process completed with exit code 1". Assert instead.
          source "$GITHUB_WORKSPACE/.github/scripts/macos_codesign.sh"
          assert_signing_identity "$KEYCHAIN_PATH" "$SIGNING_IDENTITY"

      # ── Deep re-sign the entire bundle with Developer ID ─────────────────
      # macdeployqt's nested-framework signing is unreliable, so we strip
      # every existing signature and re-sign the bundle leaves-to-root with
      # the Developer ID Application cert. Hardened runtime is required by
      # notarization; the entitlements below permit Python's JIT / dynamic
      # library loading. (Originally fixed in issue #139.)
      - name: Codesign bundle (Developer ID + hardened runtime)
        working-directory: fincept-qt
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euxo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"

          ENT="$RUNNER_TEMP/entitlements.plist"
          cat > "$ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.network.server</key><true/>
          </dict></plist>
          EOF

          # Strip extended attributes (quarantine / provenance / Finder info)
          # from the whole bundle. macdeployqt copies Qt frameworks out of the
          # aqtinstall kit, which may carry com.apple.quarantine from the
          # install-qt-action download. Leftover xattrs invalidate the
          # signature the moment the DMG is copied to /Applications on
          # macOS 14+ Apple Silicon (root cause of SIGKILL reports in #139,
          # #173, #191).
          # ── Fix bundled yt-dlp shebang ───────────────────────────────────
          # CMake bundles yt-dlp via `find_program(... NAMES yt-dlp)`, which
          # on macOS picks up Homebrew's wrapper at
          # /opt/homebrew/Cellar/yt-dlp/<ver>/libexec/bin/yt-dlp. That
          # wrapper's first line is a builder-local shebang:
          #   #!/opt/homebrew/Cellar/yt-dlp/<ver>/libexec/bin/python
          # That path doesn't exist on a user's Mac so dashboard YouTube
          # playback fails at runtime. Rewrite to `/usr/bin/env python3`
          # which resolves via the user's PATH (macOS 12.3+ ships
          # /usr/bin/python3 by default; we also embed python3 ourselves
          # at Contents/MacOS/python3 for callers that prepend the bundle
          # dir to PATH). Note: yt-dlp is not a Mach-O, so this rewrite is
          # invisible to the notary service — but the modified content
          # must be sealed by codesign, so do it BEFORE the xattr strip
          # and signing.
          YTDLP="${APP_BUNDLE}/Contents/MacOS/yt-dlp"
          if [ -f "${YTDLP}" ]; then
              FIRST_LINE=$(head -1 "${YTDLP}" 2>/dev/null || true)
              if [ "${FIRST_LINE#'#!'}" != "${FIRST_LINE}" ] && \
                 [ "${FIRST_LINE}" != "#!/usr/bin/env python3" ]; then
                  echo "Rewriting yt-dlp shebang (was: ${FIRST_LINE})"
                  TMP_YT="${YTDLP}.fix"
                  { echo "#!/usr/bin/env python3"; tail -n +2 "${YTDLP}"; } > "${TMP_YT}"
                  chmod +x "${TMP_YT}"
                  mv "${TMP_YT}" "${YTDLP}"
              fi
          fi

          echo "Stripping extended attributes from bundle..."
          xattr -cr "${APP_BUNDLE}" 2>/dev/null || true

          # ── Sign every nested Mach-O explicitly, leaves-first ────────────
          # `codesign --deep` is deprecated and does NOT propagate the
          # `--options runtime` or `--timestamp` flags to nested binaries,
          # so a bundled Python.framework comes out with ~80 unsigned .so
          # files and no secure timestamp anywhere. The notary service then
          # rejects every one of them ("The binary is not signed.",
          # "The signature does not include a secure timestamp.", "The
          # executable does not have the hardened runtime enabled.").
          #
          # Fix: walk each Mach-O / framework / nested .app and sign it
          # individually with the same identity + runtime + timestamp.
          # Then sign the top-level bundle (with entitlements) last.
          # Reference:
          #   https://developer.apple.com/documentation/security/notarizing_macos_software_before_distribution/resolving_common_notarization_issues#3087721

          SIGN_FLAGS=(--force --options runtime --timestamp --sign "$SIGNING_IDENTITY")

          # codesign_retry: `--timestamp` contacts Apple's TSA on EVERY call,
          # and this step makes hundreds of them (one per Mach-O). A single
          # rate-limit or 5xx from timestamp.apple.com is a hard codesign
          # error, and under `set -e` that ends the release job — after the
          # build, self-tests, staging and macdeployqt have all passed. Retry
          # with backoff instead of throwing ~35 minutes of work away.
          source "$GITHUB_WORKSPACE/.github/scripts/macos_codesign.sh"

          # ── Enumerate every Mach-O via `file -h`, not by filename ────────
          # Previously we filtered on `*.dylib | *.so | -perm +111`. That
          # misses three real-world cases:
          #   1. Mach-O files with no extension shipped as 0644 (some Python
          #      C extensions, some plugin systems)
          #   2. Linker stubs / utility binaries inside frameworks
          #   3. Anything macdeployqt or bundle_external_deps drops in with
          #      a non-standard name
          # `file -h` (no follow-symlinks) inspects bytes, not the path —
          # bulletproof. Cost: a few seconds extra to stat every file.
          #
          # CRITICAL: we exclude the bundle's main executable
          # (Contents/MacOS/${APP_NAME}, the file named in CFBundleExecutable)
          # from this list. When you hand codesign a path that IS a bundle's
          # main executable, codesign treats it as signing the .app bundle
          # itself and walks every nested PlugIns / Frameworks / Resources
          # entry to validate they are already signed. Signing it here —
          # before the leaf loop has signed the plugins — produces:
          #   "<MainBin>: code object is not signed at all
          #    In subcomponent: ...PlugIns/tls/libqsecuretransportbackend.dylib"
          # The main executable gets sealed by the final
          # `codesign ... "${APP_BUNDLE}"` step below, which is the
          # canonical way per Apple's "Creating Distribution-Signed Code
          # for the Mac" (sign inside-out, pass the bundle path not the
          # binary path).
          echo "Enumerating Mach-O files in bundle..."
          MACHO_LIST="$RUNNER_TEMP/macho-files.txt"
          MAIN_EXE="${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
          : > "${MACHO_LIST}"
          while IFS= read -r f; do
            [ "$f" = "${MAIN_EXE}" ] && continue
            if file -h "$f" 2>/dev/null | grep -q "Mach-O"; then
              printf '%s\n' "$f" >> "${MACHO_LIST}"
            fi
          done < <(find "${APP_BUNDLE}" -type f 2>/dev/null)
          MACHO_COUNT=$(wc -l < "${MACHO_LIST}" | tr -d ' ')
          echo "  found ${MACHO_COUNT} Mach-O file(s) (main executable signed separately at bundle root)"

          # ── NO --remove-signature pass ───────────────────────────────────
          # There used to be one here, stripping every Mach-O before re-signing.
          # It is both unnecessary and actively harmful:
          #
          #   * Unnecessary — `codesign --force` (in SIGN_FLAGS) already replaces
          #     any existing signature. That is Apple's documented mechanism.
          #   * Harmful — `--remove-signature` rewrites the Mach-O's load commands
          #     and __LINKEDIT, and is well known to leave the file in a state a
          #     later `codesign` refuses ("main executable failed strict
          #     validation" / "__LINKEDIT segment does not cover the end of the
          #     file"). Qt's dylibs arrive from aqtinstall already ad-hoc signed,
          #     so every one of them went through that rewrite. It was run with
          #     `2>/dev/null || true`, so the damage was silent and only showed up
          #     as an unexplained failure in the signing loop below.
          #
          # This is what broke the v4.4.1 release: signing died on
          # Contents/PlugIns/platforms/libqcocoa.dylib and retried 5 times, so it
          # was neither a bad certificate (the identity assertion passed) nor a
          # timestamp-service blip. Newer Xcode on the runner image validates
          # more strictly than it did when v4.4.0 shipped, which is why the same
          # workflow signed fine on 2026-08-11 and not on 2026-08-20.
          echo "Signing every Mach-O with hardened runtime + timestamp (--force replaces existing signatures)..."
          while IFS= read -r f; do
            codesign_retry "${SIGN_FLAGS[@]}" "$f" >/dev/null
          done < "${MACHO_LIST}"

          echo "Signing nested frameworks and .app bundles (deepest-first)..."
          # `-depth` makes find emit each directory AFTER its contents, so
          # nested Tcl.framework / Tk.framework / Python.app are signed
          # before the Python.framework that contains them, and every
          # framework is signed before the top-level .app below.
          BUNDLE_COUNT=0
          while IFS= read -r d; do
            codesign_retry "${SIGN_FLAGS[@]}" "$d" >/dev/null
            BUNDLE_COUNT=$((BUNDLE_COUNT + 1))
          done < <(find "${APP_BUNDLE}/Contents" -mindepth 1 -depth -type d \
                        \( -name "*.framework" -o -name "*.app" \) 2>/dev/null)
          echo "  signed ${BUNDLE_COUNT} nested bundles"

          echo "Signing top-level bundle with entitlements..."
          codesign_retry --force --options runtime --timestamp \
                   --entitlements "$ENT" \
                   --sign "$SIGNING_IDENTITY" \
                   "${APP_BUNDLE}"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}" || {
            echo "::error::Bundle verification failed"
            codesign --display --deep --verbose=4 "${APP_BUNDLE}" || true
            exit 1
          }

          echo "Signature OK:"
          codesign --display --verbose=2 "${APP_BUNDLE}" 2>&1 | head -20

          # ── Pre-flight: catch notary-fatal issues locally ────────────────
          # `codesign --verify` above validates that signatures are *present
          # and consistent*, but it does NOT enforce the three things Apple's
          # notary actually rejects on:
          #   • hardened-runtime flag set on every Mach-O
          #   • secure timestamp on every Mach-O
          #   • only the architectures we shipped (arm64)
          # We walk every Mach-O and assert each one. If any fails, we abort
          # here — that saves a 2-5 min notary round-trip for an issue we
          # could've caught on the runner.
          # Validate the main executable too — it was excluded from
          # MACHO_LIST (signed only at the bundle root step above) but
          # the notary still expects it to carry runtime+timestamp+arm64.
          echo "Pre-flight: validating every Mach-O..."
          printf '%s\n' "${MAIN_EXE}" >> "${MACHO_LIST}"
          BAD_RUNTIME=()
          BAD_TIMESTAMP=()
          BAD_ARCH=()
          while IFS= read -r f; do
            DISPLAY=$(codesign --display --verbose=2 "$f" 2>&1 || true)
            if ! echo "${DISPLAY}" | grep -q "flags=.*runtime"; then
              BAD_RUNTIME+=("$f")
            fi
            if ! echo "${DISPLAY}" | grep -q "Timestamp="; then
              BAD_TIMESTAMP+=("$f")
            fi
            # `file -h` returns one line per arch slice for a fat binary.
            # We want exactly one arm64 slice and nothing else.
            ARCHS=$(file -h "$f" 2>/dev/null | grep -oE "(arm64|x86_64|i386|ppc)" | sort -u | tr '\n' ',' | sed 's/,$//')
            if [ "${ARCHS}" != "arm64" ]; then
              BAD_ARCH+=("${f} [${ARCHS}]")
            fi
          done < "${MACHO_LIST}"

          PREFLIGHT_OK=1
          if [ "${#BAD_RUNTIME[@]}" -gt 0 ]; then
            PREFLIGHT_OK=0
            echo "::error::${#BAD_RUNTIME[@]} Mach-O(s) missing hardened runtime (notary will reject):"
            printf '    %s\n' "${BAD_RUNTIME[@]}" | head -20
          fi
          if [ "${#BAD_TIMESTAMP[@]}" -gt 0 ]; then
            PREFLIGHT_OK=0
            echo "::error::${#BAD_TIMESTAMP[@]} Mach-O(s) missing secure timestamp (notary will reject):"
            printf '    %s\n' "${BAD_TIMESTAMP[@]}" | head -20
          fi
          if [ "${#BAD_ARCH[@]}" -gt 0 ]; then
            PREFLIGHT_OK=0
            echo "::error::${#BAD_ARCH[@]} Mach-O(s) with unexpected architecture (this build is arm64-only):"
            printf '    %s\n' "${BAD_ARCH[@]}" | head -20
          fi

          # Sanity: `get-task-allow` must not appear in any signed entitlement
          # — it's a development debugging flag and Apple's notary rejects it.
          if codesign --display --entitlements - "${APP_BUNDLE}" 2>/dev/null | grep -q "get-task-allow"; then
            PREFLIGHT_OK=0
            echo "::error::get-task-allow entitlement is present — must be removed for distribution"
          fi

          if [ "${PREFLIGHT_OK}" -ne 1 ]; then
            echo "::error::Pre-flight checks failed — fix above issues before notary submission"
            exit 1
          fi
          echo "  pre-flight passed: all $((MACHO_COUNT + 1)) Mach-Os (incl. main exe) are arm64, hardened-runtime, timestamped"

          rm -f "${MACHO_LIST}"

          # Do NOT add `spctl --assess` here. spctl is a Gatekeeper
          # *post*-flight (needs a notarization ticket stapled), so on a
          # freshly-signed bundle it always fails with
          # `source=Unnotarized Developer ID`. Notarization below is the
          # authoritative check.

      # ── Notarize + staple the .app BEFORE building the DMG ───────────────
      # Stapling the .app means Gatekeeper validates offline on first launch
      # after the user drags it to /Applications. Without this, the .app
      # carries no ticket — Gatekeeper would have to phone home, and offline
      # users would see "Apple could not verify ... is free of malware".
      # The DMG gets its own notarization + staple in a later step.
      - name: Notarize and staple .app
        working-directory: fincept-qt
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"
          ZIP_PATH="$RUNNER_TEMP/app-for-notary.zip"
          SUBMIT_JSON="$RUNNER_TEMP/notary-app-submit.json"

          # ditto preserves symlinks + xattrs correctly; `zip` doesn't.
          /usr/bin/ditto -c -k --keepParent "${APP_BUNDLE}" "${ZIP_PATH}"

          # Submit WITHOUT --wait so we get the submission UUID immediately,
          # then poll status ourselves with retries. `notarytool submit --wait`
          # has no retry on transient network errors: a single dropped
          # connection during the multi-minute poll loop kills the step
          # (NSURLErrorDomain -1009 from the runner's network stack), even
          # though Apple's side accepted and is processing the submission
          # just fine. By owning the poll loop we can retry on TCP/DNS
          # blips without losing the in-flight submission.
          echo "Submitting .app to Apple notary..."
          SUBMIT_ATTEMPTS=0
          SUB_ID=""
          while [ "${SUBMIT_ATTEMPTS}" -lt 3 ]; do
            SUBMIT_ATTEMPTS=$((SUBMIT_ATTEMPTS + 1))
            if xcrun notarytool submit "${ZIP_PATH}" \
                 --apple-id "$APPLE_ID" \
                 --team-id "$TEAM_ID" \
                 --password "$NOTARY_PASSWORD" \
                 --output-format json > "${SUBMIT_JSON}" 2>&1; then
              SUB_ID=$(jq -r '.id // empty' < "${SUBMIT_JSON}")
              [ -n "${SUB_ID}" ] && break
            fi
            echo "::warning::submit attempt ${SUBMIT_ATTEMPTS} failed:"
            cat "${SUBMIT_JSON}" || true
            # A 403 "required agreement is missing or has expired" is NOT a
            # transient/network error — retrying wastes minutes and still fails.
            # It needs a human to accept Apple's updated agreements. Fail fast.
            if grep -qi 'agreement' "${SUBMIT_JSON}"; then
              echo "::error::Apple notary rejected the submission: a required Apple Developer agreement is missing or has expired (HTTP 403). Retrying cannot fix this."
              echo "::error::FIX (manual, one-time): an Account Holder must sign in at https://developer.apple.com/account, accept the updated Apple Developer Program License Agreement, and check App Store Connect -> Business (Agreements, Tax, and Banking). Then re-run this release."
              exit 1
            fi
            sleep $((SUBMIT_ATTEMPTS * 30))
          done
          if [ -z "${SUB_ID}" ]; then
            echo "::error::Could not submit to notary after ${SUBMIT_ATTEMPTS} attempts"
            exit 1
          fi
          echo "Submitted: ${SUB_ID}"

          # Poll for completion. notarytool info returns one of: In Progress,
          # Accepted, Invalid, Rejected. We retry network failures (curl/
          # NSURLError) without resubmitting — the submission already exists
          # on Apple's side, we just need to read its current state.
          echo "Polling notarization status (this can take a few minutes)..."
          STATUS="In Progress"
          POLL_START=$(date +%s)
          POLL_TIMEOUT_SEC=1800   # 30 min hard cap; Apple usually answers in 2-5 min
          NETWORK_FAILS=0
          INFO_JSON="$RUNNER_TEMP/notary-app-info.json"
          while true; do
            ELAPSED=$(( $(date +%s) - POLL_START ))
            if [ "${ELAPSED}" -gt "${POLL_TIMEOUT_SEC}" ]; then
              echo "::error::Notarization poll timed out after ${POLL_TIMEOUT_SEC}s (last status: ${STATUS})"
              exit 1
            fi

            if xcrun notarytool info "${SUB_ID}" \
                 --apple-id "$APPLE_ID" \
                 --team-id "$TEAM_ID" \
                 --password "$NOTARY_PASSWORD" \
                 --output-format json > "${INFO_JSON}" 2>&1; then
              NETWORK_FAILS=0
              STATUS=$(jq -r '.status // "Unknown"' < "${INFO_JSON}")
              echo "  [${ELAPSED}s] status=${STATUS}"
              case "${STATUS}" in
                Accepted)        break ;;
                Invalid|Rejected) break ;;
                "In Progress")   sleep 20 ;;
                *)               sleep 20 ;;
              esac
            else
              NETWORK_FAILS=$((NETWORK_FAILS + 1))
              echo "::warning::notarytool info network failure #${NETWORK_FAILS}:"
              cat "${INFO_JSON}" || true
              if [ "${NETWORK_FAILS}" -ge 10 ]; then
                echo "::error::10 consecutive network failures polling notarization — runner connectivity is broken"
                exit 1
              fi
              # Exponential backoff capped at 60s — gives DNS/TCP time to recover.
              sleep $(( NETWORK_FAILS * 5 < 60 ? NETWORK_FAILS * 5 : 60 ))
            fi
          done

          echo "Notarization submission ${SUB_ID} → ${STATUS}"
          if [ "${STATUS}" != "Accepted" ]; then
            echo "::error::Notarization failed for .app (status: ${STATUS}). Fetching Apple's log..."
            # `notarytool log <id>` returns the pretty-printed JSON log
            # whose .issues[] array names the exact files Apple rejected
            # and why (missing hardened runtime, unsigned Mach-O, etc.).
            xcrun notarytool log "${SUB_ID}" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              || echo "::warning::Could not fetch notarization log for ${SUB_ID}"
            exit 1
          fi

          echo "Stapling ticket to .app..."
          xcrun stapler staple "${APP_BUNDLE}"
          xcrun stapler validate "${APP_BUNDLE}"
          rm -f "${ZIP_PATH}" "${SUBMIT_JSON}" "${INFO_JSON}"

      # ── Smoke-test the SIGNED bundle ──────────────────────────────────────
      # Until this step existed, the macOS artifact got ZERO runtime
      # verification — "Verify binary" is only `[ -f ]` plus `lipo -info`. It
      # runs AFTER codesign + notarize + staple deliberately: launching the
      # binary from inside the sealed bundle is the only check that proves the
      # signature is actually loadable. That is exactly the failure mode of
      # issue #139 (dyld SIGKILL "Code Signature Invalid" from a framework
      # embedded after signing) — a broken seal aborts the process here
      # instead of on a user's Mac. It also walks every screen against the
      # macdeployqt-bundled Qt, the counterpart of the Windows clean-PATH
      # gate. codesign --verify is re-run first so a seal break is reported as
      # a signature error rather than an opaque crash.
      - name: Smoke-test signed .app bundle
        working-directory: fincept-qt
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: |
          set -euo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"
          BINARY="${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
          [ -f "${BINARY}" ] || { echo "::error::signed bundle binary not found at ${BINARY}"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"
          bash ../.github/scripts/ci_app_checks.sh smoke "${BINARY}" ci-smoke 600

      # ── Copy signed bundle to dist/ ───────────────────────────────────────
      - name: Finalize dist
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R "build/${{ env.APP_NAME }}.app" "dist/"
          echo "Final bundle size: $(du -sh "dist/${{ env.APP_NAME }}.app" | cut -f1)"

      # ── Optional: QtIFW "wizard" installer with a Target Directory page ─────
      # Additive to the DMG (which stays the in-app update asset). The CMake
      # install rule copies the SIGNED build/FinceptTerminal.app via `ditto`, so
      # code signatures survive (issue #139). Output is named "-wizard.zip" so it
      # never matches the README table's macOS regex (\.dmg$|macos.*setup); the
      # update manifest lists only the exact -setup.dmg name.
      # NOTE: VALIDATE ON A REAL RUNNER — this is the first IFW-on-macOS
      # build/sign/notarize path. The bundle is signed + stapled BEFORE this step
      # (the staple step above), satisfying the install-rule contract.
      - name: Generate IFW wizard installer (sign + notarize)
        working-directory: fincept-qt
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(grep -Eo 'project\(FinceptTerminal VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
          command -v binarycreator >/dev/null || { echo "::error::binarycreator not on PATH"; exit 1; }

          # Reconfigure with the installer path ON (reuses the cached build); the
          # install(CODE ditto) rule packages the already-signed bundle.
          cmake -S . -B build -DFINCEPT_BUILD_INSTALLER=ON >/dev/null
          BASENAME="FinceptTerminal-${VERSION}-macos-arm64-wizard"
          ( cd build && cpack -G IFW -C ${{ env.BUILD_TYPE }} \
                -D CPACK_PACKAGE_FILE_NAME="${BASENAME}" --verbose )

          WIZ_APP="build/${BASENAME}.app"
          # CPack's IFW generator emits a .dmg on macOS (not a raw .app bundle), so
          # the .app-based sign/notarize path below doesn't apply. This optional
          # "wizard" installer is additive to the signed -setup.dmg (next step) and
          # this path is not yet validated for the .dmg output — skip gracefully
          # rather than fail the release. (See the step's NOTE above.)
          if [ ! -d "${WIZ_APP}" ]; then
            echo "::warning::macOS IFW wizard .app not produced (cpack emitted: $(ls build/${BASENAME}.* 2>/dev/null | xargs -n1 basename 2>/dev/null | tr '\n' ' ')). Skipping optional wizard installer; signed -setup.dmg is unaffected."
            exit 0
          fi

          source "$GITHUB_WORKSPACE/.github/scripts/macos_codesign.sh"

          # Sign the installer app's own Mach-Os leaf-first (the payload is an
          # embedded archive that is already signed+notarized+stapled).
          # Retried like everywhere else: the trailing `|| true` keeps a leaf
          # failure non-fatal, but without the retry a transient TSA error
          # left an unsigned Mach-O behind that the notary rejected minutes
          # later — a silent skip turning into a confusing downstream failure.
          while IFS= read -r m; do
            codesign_retry --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$m" || true
          done < <(find "${WIZ_APP}" -type f \( -perm -u+x -o -name "*.dylib" \) 2>/dev/null)
          codesign_retry --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "${WIZ_APP}"

          # Notarize a zip of the installer app, then staple. (For production,
          # adopt the submit/poll/staple loop used by the DMG step — --wait has
          # no retry on the runner's transient notary network errors.)
          ZIP="${RUNNER_TEMP}/${BASENAME}.zip"
          /usr/bin/ditto -c -k --keepParent "${WIZ_APP}" "${ZIP}"
          if SUB_ID=$(xcrun notarytool submit "${ZIP}" \
                --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" \
                --wait --output-format json | jq -r '.id // empty') && [ -n "${SUB_ID}" ]; then
            xcrun stapler staple "${WIZ_APP}" || echo "::warning::stapling wizard failed"
          else
            echo "::warning::wizard installer notarization unconfirmed — validate manually"
          fi

          # Ship as a zip (a bare .app can't be a GH release asset).
          DIST_ZIP="build/${BASENAME}.zip"
          /usr/bin/ditto -c -k --keepParent "${WIZ_APP}" "${DIST_ZIP}"
          ls -lh "${DIST_ZIP}"

      # ── Generate Installer (DMG via hdiutil) ──────────────────────────────
      # We intentionally skip CPack IFW on macOS: CPack's install(TARGETS ...
      # BUNDLE) rule packages the raw build-tree .app, NOT the post-processed
      # one we just ran macdeployqt + deep codesign over. Shipping the raw
      # bundle produces the dyld SIGKILL "Code Signature Invalid" crash
      # tracked in issue #139. A plain hdiutil DMG over `dist/` (which
      # contains the signed bundle) gives users a working drag-to-Apps DMG.
      - name: Generate Installer (DMG)
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          # Parse project() VERSION so the DMG filename is exactly what the
          # update manifest lists as macos-arm64-dmg:
          # FinceptTerminal-<version>-macos-arm64-setup.dmg
          VERSION=$(grep -Eo 'project\(FinceptTerminal VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
          [ -n "${VERSION}" ] || { echo "::error::Could not parse VERSION from CMakeLists.txt"; exit 1; }
          DMG_NAME="FinceptTerminal-${VERSION}-macos-arm64-setup.dmg"
          echo "DMG target: ${DMG_NAME}"

          STAGING="$(mktemp -d)/dmg_staging"
          mkdir -p "${STAGING}"
          # The edition's .app name (CMakeLists.txt "Edition identity"): the private
          # build's DMG also holds FinceptTerminal.app, and dragging either into
          # /Applications replaced the other. Renaming the bundle folder leaves its
          # signature and stapled ticket valid.
          cp -R "dist/${{ env.APP_NAME }}.app" "${STAGING}/Fincept Terminal Community.app"
          # Symlink /Applications so users can drag the app across in the DMG.
          ln -s /Applications "${STAGING}/Applications"
          # Complete uninstaller beside the app (outside the signed bundle, so the
          # seal is untouched). A .command opens in Terminal on double-click.
          install -m 755 packaging/uninstall/uninstall.sh "${STAGING}/Uninstall Fincept Terminal.command"

          hdiutil create \
            -volname "Fincept Terminal Community" \
            -srcfolder "${STAGING}" \
            -ov -format UDZO \
            "build/${DMG_NAME}"

          ls -lh "build/${DMG_NAME}"

      # ── Sign + Notarize + Staple DMG ──────────────────────────────────────
      # Sign the DMG itself, submit to Apple's notary service, and staple
      # the resulting ticket so Gatekeeper can verify offline. After this
      # step the DMG opens on any Mac without "unidentified developer"
      # warnings.
      - name: Sign and notarize DMG
        working-directory: fincept-qt
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG=$(ls build/FinceptTerminal-*-macos-arm64-setup.dmg | head -1)
          echo "Signing DMG: ${DMG}"
          source "$GITHUB_WORKSPACE/.github/scripts/macos_codesign.sh"
          codesign_retry --force --sign "$SIGNING_IDENTITY" --timestamp "$DMG"

          # Same submit-then-poll pattern as the .app step: --wait has no
          # retry on transient network errors (NSURLErrorDomain -1009 from
          # the runner), so we own the poll loop.
          SUBMIT_JSON="$RUNNER_TEMP/notary-dmg-submit.json"
          INFO_JSON="$RUNNER_TEMP/notary-dmg-info.json"

          echo "Submitting DMG to Apple notary..."
          SUBMIT_ATTEMPTS=0
          SUB_ID=""
          while [ "${SUBMIT_ATTEMPTS}" -lt 3 ]; do
            SUBMIT_ATTEMPTS=$((SUBMIT_ATTEMPTS + 1))
            if xcrun notarytool submit "$DMG" \
                 --apple-id "$APPLE_ID" \
                 --team-id "$TEAM_ID" \
                 --password "$NOTARY_PASSWORD" \
                 --output-format json > "${SUBMIT_JSON}" 2>&1; then
              SUB_ID=$(jq -r '.id // empty' < "${SUBMIT_JSON}")
              [ -n "${SUB_ID}" ] && break
            fi
            echo "::warning::DMG submit attempt ${SUBMIT_ATTEMPTS} failed:"
            cat "${SUBMIT_JSON}" || true
            # See .app notarize step: a 403 agreement error is not transient.
            if grep -qi 'agreement' "${SUBMIT_JSON}"; then
              echo "::error::Apple notary rejected the DMG: a required Apple Developer agreement is missing or has expired (HTTP 403). Retrying cannot fix this."
              echo "::error::FIX (manual, one-time): an Account Holder must accept the updated Apple Developer Program License Agreement at https://developer.apple.com/account, then re-run this release."
              exit 1
            fi
            sleep $((SUBMIT_ATTEMPTS * 30))
          done
          if [ -z "${SUB_ID}" ]; then
            echo "::error::Could not submit DMG to notary after ${SUBMIT_ATTEMPTS} attempts"
            exit 1
          fi
          echo "Submitted: ${SUB_ID}"

          echo "Polling DMG notarization status..."
          STATUS="In Progress"
          POLL_START=$(date +%s)
          POLL_TIMEOUT_SEC=1800
          NETWORK_FAILS=0
          while true; do
            ELAPSED=$(( $(date +%s) - POLL_START ))
            if [ "${ELAPSED}" -gt "${POLL_TIMEOUT_SEC}" ]; then
              echo "::error::DMG notarization poll timed out after ${POLL_TIMEOUT_SEC}s (last: ${STATUS})"
              exit 1
            fi
            if xcrun notarytool info "${SUB_ID}" \
                 --apple-id "$APPLE_ID" \
                 --team-id "$TEAM_ID" \
                 --password "$NOTARY_PASSWORD" \
                 --output-format json > "${INFO_JSON}" 2>&1; then
              NETWORK_FAILS=0
              STATUS=$(jq -r '.status // "Unknown"' < "${INFO_JSON}")
              echo "  [${ELAPSED}s] status=${STATUS}"
              case "${STATUS}" in
                Accepted)        break ;;
                Invalid|Rejected) break ;;
                *)               sleep 20 ;;
              esac
            else
              NETWORK_FAILS=$((NETWORK_FAILS + 1))
              echo "::warning::notarytool info network failure #${NETWORK_FAILS}:"
              cat "${INFO_JSON}" || true
              if [ "${NETWORK_FAILS}" -ge 10 ]; then
                echo "::error::10 consecutive network failures — runner connectivity is broken"
                exit 1
              fi
              sleep $(( NETWORK_FAILS * 5 < 60 ? NETWORK_FAILS * 5 : 60 ))
            fi
          done

          echo "DMG notarization submission ${SUB_ID} → ${STATUS}"
          if [ "${STATUS}" != "Accepted" ]; then
            echo "::error::Notarization failed for DMG (status: ${STATUS}). Fetching Apple's log..."
            xcrun notarytool log "${SUB_ID}" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              || echo "::warning::Could not fetch notarization log for ${SUB_ID}"
            exit 1
          fi

          echo "Stapling ticket..."
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG" || true
          rm -f "${SUBMIT_JSON}" "${INFO_JSON}"

      # ── Clean up the temp keychain ────────────────────────────────────────
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FinceptTerminal-macOS-arm64-installer
          path: |
            fincept-qt/build/FinceptTerminal-*-macos-arm64-setup.dmg
            fincept-qt/build/FinceptTerminal-*-macos-arm64-wizard.zip
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 4 — Linux x86_64 Flatpak bundle (single-file .flatpak) — the main Linux
#          package
#
# Built in Flathub's CI image (flatpak-builder, org.kde.Sdk + Platform 6.11
# preinstalled), calling flatpak-builder directly (the build step says why not
# the official action), from the commit being released — NOT from the tag the
# committed manifest pins. The image tag below and the manifest's
# runtime-version must name the same KDE runtime ("Runtime matches the image"
# fails the job in seconds if they drift). Flathub publishes images only for
# supported runtimes (github.com/flathub-infra/actions-images lists the tags):
# when a runtime goes end-of-life its tag disappears, so move both together
# to the newest listed kde-6.x. The app then builds against that runtime's Qt
# (the manifest passes FINCEPT_QT_PIN_MODE=ANY), not the 6.8.3 the other
# installers pin. The committed manifest stays in Flathub form (git tag +
# commit) and its pin lags the project by design, so "Derive the CI manifest"
# writes a copy that builds this checkout, and fails if the main-repository
# source is not where it expects. All checks of this job live in this file.
#
# No `needs`: it runs beside the other build jobs. The release job REQUIRES it.
#
# Asset: FinceptTerminal-<version>-linux-x86_64.flatpak; the update manifest
# lists it by exact name under its own key, linux-x64-flatpak.
# ═════════════════════════════════════════════════════════════════════════════
  build-flatpak:
    name: Linux x86_64 Flatpak
    # Manual runs: "all" and "flatpak" build it, "deb" does not.
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'deb'
    runs-on: ubuntu-24.04
    # Cold build (see "Build Flatpak bundle" on why there is no cache): ~20 min
    # on 48 cores locally, so expect a few hours on a 4-vCPU hosted runner.
    timeout-minutes: 300
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      # bubblewrap (flatpak-builder's build sandbox, `flatpak run`) needs
      # namespaces the default container profile does not grant.
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      FLATPAK_APP_ID: in.fincept.FinceptTerminal
      FLATPAK_MANIFEST: src/fincept-qt/packaging/flatpak/in.fincept.FinceptTerminal.yml
      # The KDE runtime of the container image above (its tag, without "kde-").
      FLATPAK_IMAGE_RUNTIME: "6.11"
      # flatpak-builder-lint (Flathub's linter) as ::warning:: annotations plus a
      # job-summary table: `python3 -c "$FLATPAK_LINT_PY" manifest|repo PATH`.
      # Its "errors" block a Flathub submission, not this release, so it never
      # fails the job. Known findings carry the reason they are there, so a new
      # one stands out.
      FLATPAK_LINT_PY: |
        import json, os, shutil, subprocess, sys
        kind, path = sys.argv[1], sys.argv[2]
        title = f"flatpak-builder-lint {kind}"
        KNOWN = {
            "finish-args-contains-both-x11-and-wayland":
                "deliberate: the app prefers X11 while its docking UI is validated only on X11/XWayland "
                "(see the finish-args comment in the manifest). Flathub needs --socket=fallback-x11 or an exception.",
            "appstream-external-screenshot-url":
                "expected outside Flathub: its builder mirrors screenshots to dl.flathub.org; CI does not.",
            "appstream-screenshots-not-mirrored-in-ostree":
                "expected outside Flathub, same cause as appstream-external-screenshot-url.",
            "finish-args-flatpak-spawn-access":
                "deliberate: coding agents (Claude Code, Codex, Gemini CLI, ...) are CLIs installed on the "
                "user's system and run there via flatpak-spawn --host (src/core/process/HostExec.cpp); "
                "optional feature, no filesystem grant added. Flathub review needs this justification "
                "(see the finish-args comment in the manifest).",
        }
        tool = shutil.which("flatpak-builder-lint")
        if not tool:
            print(f"::warning title={title}::flatpak-builder-lint is not installed in this image; lint skipped")
            sys.exit(0)
        proc = subprocess.run([tool, kind, path], capture_output=True, text=True)
        try:
            report = json.loads(proc.stdout)
        except ValueError:
            sys.stdout.write(proc.stdout + proc.stderr)
            print(f"::warning title={title}::the linter produced no JSON report (exit {proc.returncode}); see the log")
            sys.exit(0)
        print(json.dumps(report, indent=2))
        found = [(level, code) for level in ("error", "warning") for code in report.get(level + "s") or []]
        rows = [f"### {title} `{path}`", ""]
        rows += ["| Flathub level | Finding | Note |", "|---|---|---|"] if found else ["No findings."]
        for level, code in found:
            note = KNOWN.get(code, "new finding, not reviewed yet")
            print(f"::warning title={title}::[Flathub {level}] {code}: {note}")
            rows.append(f"| {level} | `{code}` | {note} |")
        for line in report.get("info") or []:
            print(f"info: {line}")
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
            fh.write("\n".join(rows) + "\n\n")

    steps:
      # Into src/ so flatpak-builder's own directories (flatpak_app/, repo/,
      # .flatpak-builder/, created in the workspace root) are never inside the
      # directory the build copies in as its source.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: src
          submodules: recursive
          fetch-depth: 1

      # Seconds, not hours: fail before the build if the metadata a build of
      # this tree reports disagrees with CMake (check_version_drift.sh: the
      # newest <release> of every AppStream file equals project VERSION — what
      # `flatpak list` shows), or if the committed manifest, metainfo or
      # desktop entry would fail Flathub's rules that need no build. The
      # [manifest-pin] lag WARNING is expected between a release and the next
      # Flathub update: the build below does not use the pin.
      - name: Version + metadata consistency
        id: meta
        run: |
          set -euo pipefail
          cd src
          VERSION=$(grep -Eo 'project\(FinceptTerminal VERSION [0-9]+\.[0-9]+\.[0-9]+' fincept-qt/CMakeLists.txt | awk '{print $3}')
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not parse project VERSION from fincept-qt/CMakeLists.txt"
            exit 1
          fi
          echo "Package version: ${VERSION} (commit ${GITHUB_SHA})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bundle=${{ env.APP_NAME }}-${VERSION}-linux-x86_64.flatpak" >> "$GITHUB_OUTPUT"
          bash .github/scripts/check_version_drift.sh .
          python3 - <<'PY'
          import io, os, re, subprocess, sys, xml.dom.minidom
          import yaml
          D, APPID = "fincept-qt/packaging/flatpak", "in.fincept.FinceptTerminal"
          fails = []
          def ck(ok, label, hard=True):
              print(f"  [{'PASS' if ok else ('FAIL' if hard else 'WARN')}] {label}")
              if not ok:
                  print(f"::{'error' if hard else 'warning'} title=Flatpak pre-flight::{label}")
                  if hard:
                      fails.append(label)
          vkey = lambda v: tuple(int(x) for x in re.findall(r"\d+", v or ""))

          man = yaml.safe_load(io.open(f"{D}/{APPID}.yml", encoding="utf-8"))
          ck(man.get("id") == APPID, f"manifest id is {APPID}")
          ck(bool(man.get("command") and man.get("runtime") and man.get("sdk")), "command, runtime and sdk declared")
          # Flathub: every git source pinned by a full commit (a tag alone is mutable).
          srcs = [s for m in man["modules"] if isinstance(m, dict) for s in m.get("sources", [])
                  if isinstance(s, dict) and s.get("type") == "git"]
          for s in srcs:
              ck(bool(re.fullmatch(r"[0-9a-f]{40}", str(s.get("commit", "")))), f"{s['url']} pinned by a full commit")
          main = [s for s in srcs if "FinceptTerminal.git" in s["url"]]
          ck(len(main) == 1 and bool(main and main[0].get("tag")), "exactly one main-repository git source, with tag + commit")
          if len(main) == 1 and main[0].get("tag"):
              # The pinned tag exists on the remote (a shallow checkout has no tags) and is that commit.
              tag, url = main[0]["tag"], main[0]["url"]
              r = subprocess.run(["git", "ls-remote", "--tags", url, f"refs/tags/{tag}", f"refs/tags/{tag}^{{}}"],
                                 capture_output=True, text=True)
              refs = {ref.strip(): sha.strip() for sha, ref in
                      (line.split("\t", 1) for line in r.stdout.splitlines() if "\t" in line)}
              ck(r.returncode == 0 and f"refs/tags/{tag}" in refs, f"tag {tag} exists on {url}")
              got = refs.get(f"refs/tags/{tag}^{{}}") or refs.get(f"refs/tags/{tag}")
              ck(got == main[0].get("commit"), f"commit matches tag {tag} ({(got or 'not found')[:8]})")

          dom = xml.dom.minidom.parse(f"{D}/{APPID}.metainfo.xml")
          def text(tag):
              n = dom.getElementsByTagName(tag)
              return n[0].firstChild.nodeValue.strip() if n and n[0].firstChild else None
          ck(text("id") == APPID, "metainfo id is the app id")
          for t in ("name", "summary", "metadata_license", "project_license"):
              ck(bool(text(t)), f"<{t}> present")
          ck(text("launchable") == f"{APPID}.desktop", "launchable is the desktop id")
          ck(bool(dom.getElementsByTagName("content_rating")), "content_rating (OARS) present")
          imgs = [n.firstChild.nodeValue.strip() for n in dom.getElementsByTagName("image") if n.firstChild]
          ck(bool(imgs), f"{len(imgs)} screenshots listed")
          for u in imgs:
              ck("/main/" not in u and "/master/" not in u, f"screenshot pinned, not on a branch: {u.rsplit('/', 1)[-1]}")
              ck(os.path.isfile(os.path.join("images", u.split("/images/")[-1])), f"screenshot source images/{u.split('/images/')[-1]}")
          # Commented-out <release> drafts are skipped, as AppStream tools do.
          rels = [r.getAttribute("version") for r in dom.getElementsByTagName("release")]
          ck(rels == sorted(rels, key=vkey, reverse=True), "releases listed newest first")
          for r in dom.getElementsByTagName("release"):
              ck(bool(re.fullmatch(r"\d{4}-\d{2}-\d{2}", r.getAttribute("date"))), f"release {r.getAttribute('version')} has an ISO date")
          if len(main) == 1 and main[0].get("tag") and rels:
              pin, newest = main[0]["tag"].lstrip("v"), max(rels, key=vkey)
              ck(pin in rels and vkey(pin) <= vkey(newest), f"[manifest-pin] v{pin} is a listed release, not ahead of {newest}")
              ck(pin == newest, f"[manifest-pin] the Flathub-form manifest pins v{pin}, the newest release is {newest}: "
                                f"expected until the Flathub update (CI builds this checkout). Before submitting, move the pin "
                                f"to v{newest}, only to a tag whose tree builds in the offline sandbox", hard=False)

          kv = dict(l.split("=", 1) for l in io.open(f"{D}/{APPID}.desktop", encoding="utf-8").read().splitlines()
                    if "=" in l and not l.startswith("["))
          ck(kv.get("Type") == "Application" and bool(kv.get("Name")), "desktop entry: Type=Application and a Name")
          ck(kv.get("Icon") == APPID, "desktop entry: Icon is the app id")
          ck(kv.get("Exec", "").split()[:1] == [man.get("command")], "desktop entry: Exec runs the manifest command")
          ck("%" not in kv.get("Exec", ""), "desktop entry: Exec has no field code the app cannot honour")
          ck("MimeType" not in kv, "desktop entry declares no MimeType (no shared-mime-info XML is installed)", hard=False)
          main_cats = {"AudioVideo", "Audio", "Video", "Development", "Education", "Game", "Graphics",
                       "Network", "Office", "Science", "Settings", "System", "Utility"}
          ck(bool(set(kv.get("Categories", "").split(";")) & main_cats), "desktop entry: a main category")
          ck(os.path.isfile(f"fincept-qt/resources/{APPID}.png"), "256x256 icon present")
          print(f"{len(fails)} failure(s)")
          sys.exit(1 if fails else 0)
          PY

      # The image carries exactly one KDE SDK/runtime. A manifest asking for
      # another one would make flatpak-builder stop with "runtime not
      # installed" only after the checkout and metadata steps.
      - name: Runtime matches the image
        run: |
          set -euo pipefail
          WANT=$(grep -E "^runtime-version:" "${FLATPAK_MANIFEST}" | tr -d "'\"\r" | awk '{print $2}')
          if [ "${WANT}" != "${FLATPAK_IMAGE_RUNTIME}" ]; then
            echo "::error::Manifest runtime-version is '${WANT}' but the job's image is kde-${FLATPAK_IMAGE_RUNTIME} — change both together"
            exit 1
          fi
          flatpak info "org.kde.Sdk//${WANT}" >/dev/null 2>&1 \
            || { echo "::error::org.kde.Sdk//${WANT} is not installed in this image"; flatpak list --runtime || true; exit 1; }
          echo "KDE runtime ${WANT}: $(flatpak info --show-commit "org.kde.Sdk//${WANT}" 2>/dev/null || echo present)"

      # A copy of the committed manifest in which exactly one source — the git
      # source of the main repository — is replaced by a `type: dir` source for
      # this checkout; every other module, command, finish-arg and source is
      # carried over (relative paths re-anchored to the copy's folder). Fails,
      # writing nothing, when no source or more than one fetches the main
      # repository, when it is not `type: git` or has a key a dir source cannot
      # carry, or when a module / source is an external file it cannot inspect.
      - name: Derive the CI manifest (build this commit, not the pinned tag)
        run: |
          set -euo pipefail
          python3 - "${FLATPAK_MANIFEST}" "flatpak-ci/${FLATPAK_APP_ID}.yml" src <<'PY'
          import copy, os, sys, yaml
          src, out, checkout = sys.argv[1], sys.argv[2], os.path.abspath(sys.argv[3])
          REPO = "github.com/fincept-corporation/finceptterminal"
          def die(msg):
              print(f"::error title=CI Flatpak manifest::{msg}")
              sys.exit(1)
          def norm(url):
              u = url.strip().lower().rstrip("/")
              u = u[:-4] if u.endswith(".git") else u
              for prefix in ("https://", "http://", "git://", "ssh://git@", "git@"):
                  if u.startswith(prefix):
                      u = u[len(prefix):]
                      break
              return u.replace("github.com:", "github.com/", 1)
          mdir, odir = os.path.dirname(os.path.abspath(src)), os.path.dirname(os.path.abspath(out))
          def anchor(p):
              return os.path.relpath(os.path.join(mdir, p), odir) if isinstance(p, str) and not os.path.isabs(p) else p
          derived = copy.deepcopy(yaml.safe_load(open(src, encoding="utf-8")))
          hits = []
          def walk(mods, trail):
              for i, m in enumerate(mods or []):
                  if not isinstance(m, dict):
                      die(f"{trail}[{i}] is an external module file ({m!r}); inline it so CI can see what it builds")
                  label = f"{trail}[{m.get('name', i)}]"
                  for j, s in enumerate(m.get("sources") or []):
                      if not isinstance(s, dict):
                          die(f"{label}.sources[{j}] is an external source file ({s!r})")
                      if any(isinstance(u, str) and (norm(u) == REPO or norm(u).startswith(REPO + "/"))
                             for u in [s.get("url"), *(s.get("mirror-urls") or [])]):
                          hits.append((m["sources"], j, f"{label}.sources[{j}]"))
                          continue
                      for k in ("path", "paths"):
                          if isinstance(s.get(k), str):
                              s[k] = anchor(s[k])
                          elif isinstance(s.get(k), list):
                              s[k] = [anchor(p) for p in s[k]]
                  walk(m.get("modules"), label + ".modules")
          walk(derived.get("modules"), "modules")
          if len(hits) != 1:
              die(f"{len(hits)} sources fetch the main repository ({', '.join(h[2] for h in hits) or 'none'}); "
                  f"expected exactly one `type: git` source with tag + commit")
          sources, j, where = hits[0]
          git = sources[j]
          if git.get("type") != "git":
              die(f"{where} fetches the main repository as `type: {git.get('type')}`, not `type: git`")
          carried = ("dest", "only-arches", "skip-arches")
          unknown = sorted(set(git) - set(carried) - {"type", "url", "tag", "commit", "branch", "disable-shallow-clone",
                                                       "disable-submodules", "disable-fsckobjects", "x-checker-data"})
          if unknown:
              die(f"{where} has keys a dir source cannot carry: {', '.join(unknown)}")
          sources[j] = {"type": "dir", "path": os.path.relpath(checkout, odir), "skip": [".git"],
                        **{k: git[k] for k in carried if k in git}}
          class Dumper(yaml.SafeDumper):
              pass
          # Multi-line build commands stay block scalars (PyYAML quotes what a block cannot hold).
          Dumper.add_representer(str, lambda d, v: d.represent_scalar("tag:yaml.org,2002:str", v,
                                                                      style="|" if "\n" in v else None))
          text = (f"# GENERATED in CI from {os.path.relpath(src, checkout)} -- do not edit or commit.\n"
                  f"# {where}: git {git.get('url')} ({git.get('tag', '')} {git.get('commit', '')}) -> dir {checkout}\n"
                  + yaml.dump(derived, Dumper=Dumper, sort_keys=False, allow_unicode=True,
                              default_flow_style=False, width=1_000_000))
          if yaml.safe_load(text) != derived:
              die("the derived manifest does not read back as written")
          os.makedirs(odir, exist_ok=True)
          with open(out, "w", encoding="utf-8", newline="\n") as fh:
              fh.write(text)
          print(f"Wrote {out}: {where} -> dir {checkout}")
          PY
          cat "flatpak-ci/${FLATPAK_APP_ID}.yml"

      # Flathub's linter on the committed (Flathub-form) manifest.
      - name: Lint manifest (flatpak-builder-lint, non-blocking)
        run: python3 -c "$FLATPAK_LINT_PY" manifest "${FLATPAK_MANIFEST}"

      # The invocation validated by hand, called directly rather than through
      # flatpak/flatpak-github-actions/flatpak-builder (v6): that action always
      # adds --install-deps-from=flathub and has no input to turn it off. With
      # the 6.8 image that tried to update the preinstalled SDK, failed on the
      # container's overlay filesystem ("Invalid cross-device link") and
      # crashed flatpak-builder. The image already carries the SDK and runtime,
      # so nothing needs installing, and the bundle name, the checks and the
      # upload below stay under this job's control.
      # No cache: release runs are triggered by tags, and an Actions cache saved
      # under one tag is not visible to the next tag's run, so it would only
      # consume the repository's cache quota.
      - name: Build Flatpak bundle (flatpak-builder)
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --state-dir=.flatpak-builder --repo=repo \
            flatpak_app "flatpak-ci/${FLATPAK_APP_ID}.yml"
          flatpak build-bundle repo "${{ steps.meta.outputs.bundle }}" "${FLATPAK_APP_ID}" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      # Blocking checks on what was exported (flatpak_app/ is the build dir
      # above): the runtime payload, the cleanup of the non-Flatpak
      # desktop/AppStream duplicates, and the version Flatpak reports — read
      # from the composed AppStream data that `flatpak list` uses (it said
      # 4.4.1 for a 4.5.2 build before the metainfo had a 4.5.2 entry).
      - name: Verify bundle
        run: |
          set -euo pipefail
          BUNDLE="${{ steps.meta.outputs.bundle }}"
          VERSION="${{ steps.meta.outputs.version }}"
          FILES=flatpak_app/files
          [ -s "${BUNDLE}" ] || { echo "::error::${BUNDLE} was not produced"; ls -la; exit 1; }
          [ -d "${FILES}" ] || { echo "::error::build dir ${FILES} not found"; ls -la; exit 1; }
          # The first real build was 53 MB, of which yt-dlp alone is ~34 MB:
          # below 40 MB the app itself is missing or hollow.
          SIZE_KB=$(du -k "${BUNDLE}" | cut -f1)
          if [ "${SIZE_KB}" -lt 40960 ]; then
            echo "::error::${BUNDLE} is only ${SIZE_KB} KB — the app payload is missing"
            exit 1
          fi

          MISSING=""
          for f in bin/FinceptTerminal libexec/fincept-terminal/yt-dlp \
                   share/fincept-terminal/scripts \
                   "share/applications/${FLATPAK_APP_ID}.desktop" \
                   "share/metainfo/${FLATPAK_APP_ID}.metainfo.xml" \
                   "share/icons/hicolor/256x256/apps/${FLATPAK_APP_ID}.png"; do
            [ -e "${FILES}/${f}" ] || MISSING="${MISSING} ${f}"
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::Flatpak payload is missing:${MISSING}"
            exit 1
          fi
          for f in share/applications/fincept-terminal-community.desktop share/metainfo/fincept-terminal-community.appdata.xml; do
            if [ -e "${FILES}/${f}" ]; then
              echo "::error::${f} is in the package — the manifest's cleanup list no longer removes the non-Flatpak duplicate"
              exit 1
            fi
          done

          APPDATA="${FILES}/share/app-info/xmls/${FLATPAK_APP_ID}.xml.gz"
          [ -f "${APPDATA}" ] || { echo "::error::${APPDATA} not found — cannot tell which version Flatpak will report"; exit 1; }
          REPORTED=$(zcat "${APPDATA}" | grep -o '<release [^>]*version="[^"]*"' \
                       | sed 's/.*version="//; s/"$//' | sort -V | tail -n 1 || true)
          if [ "${REPORTED}" != "${VERSION}" ]; then
            echo "::error::Flatpak will report version '${REPORTED}' but CMakeLists.txt says ${VERSION} — add the <release> entry to ${FLATPAK_APP_ID}.metainfo.xml"
            exit 1
          fi
          echo "Bundle OK: ${BUNDLE} ($(du -h "${BUNDLE}" | cut -f1)), reports version ${REPORTED}"

      - name: Lint built repo (flatpak-builder-lint, non-blocking)
        run: python3 -c "$FLATPAK_LINT_PY" repo repo

      # Installs the bundle per-user (its runtime resolves from the image's
      # system installation, as it would from Flathub) and walks every screen
      # through `flatpak run` inside a private session bus and a virtual X
      # display (QT_QPA_PLATFORM=xcb: the sandbox's real x11 socket path, not
      # the offscreen plugin). Requires the walk's own "[Smoke] OK:" line, not
      # only exit status 0.
      #
      # NON-BLOCKING FOR NOW: validated locally in this exact image (fresh
      # container: bundle install, "[Smoke] OK: all 52 screens constructed"),
      # never yet on a hosted runner. After its first green run, make it
      # blocking: delete `continue-on-error` and the CHECK_SEVERITY line below.
      - name: Smoke-test the bundle in its sandbox
        timeout-minutes: 25
        continue-on-error: true
        env:
          CHECK_SEVERITY: warning
        run: |
          set -uo pipefail
          BUNDLE="${{ steps.meta.outputs.bundle }}"
          flatpak install --user --noninteractive -y --bundle "${BUNDLE}" \
            || { echo "::warning::Flatpak smoke test: flatpak install of ${BUNDLE} failed"; exit 1; }
          # `flatpak run` failed with "Could not connect: No such file or
          # directory" in a container with no system bus. This image's own
          # system.conf cannot start (no "messagebus" user), so a bus from the
          # session configuration answers at the system-bus address.
          if [ ! -S /run/dbus/system_bus_socket ]; then
            mkdir -p /run/dbus
            [ -s /etc/machine-id ] || dbus-uuidgen --ensure=/etc/machine-id || true
            dbus-daemon --session --fork --nopidfile --address=unix:path=/run/dbus/system_bus_socket || true
          fi
          export DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
          LAUNCHER="${RUNNER_TEMP}/flatpak-launcher"
          printf '#!/bin/sh\nexec flatpak run %s "$@"\n' "${FLATPAK_APP_ID}" >"${LAUNCHER}"
          chmod +x "${LAUNCHER}"
          QT_QPA_PLATFORM=xcb dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" \
            bash src/.github/scripts/ci_app_checks.sh smoke "${LAUNCHER}" ci-flatpak-smoke 900 2>&1 | tee smoke.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::warning::Flatpak smoke test: the screen walk failed; the last '[Smoke] >>> constructing <id>' line above names the screen"
            exit 1
          fi
          grep -a '\[Smoke\] OK:' smoke.log \
            || { echo "::warning::Flatpak smoke test: exit 0 but no '[Smoke] OK:' line — the walk did not run in the sandbox"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FinceptTerminal-Linux-x86_64-flatpak
          path: ${{ steps.meta.outputs.bundle }}
          if-no-files-found: error
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 5 — Create GitHub Release and attach all installers + the signed update
#          manifest (updates.json, updates.json.sig)
#          Only runs on tag push after all builds succeed
# ═════════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    # verify-deb: the .deb is published only after it installed, opened and
    # uninstalled cleanly on every supported base.
    needs: [build-windows, build-linux, verify-deb, build-macos, build-flatpak]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.verify-deb.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-flatpak.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    outputs:
      # Pass the tag so update-readme can use it
      tag: ${{ github.ref_name }}

    steps:
      # Only what the update-manifest steps read: the two scripts, CMakeLists.txt
      # (VERSION) and UpdateManifest.h (the public key the client pins). Runs
      # first so the artifact downloads below land in the finished checkout.
      - name: Checkout manifest scripts and the pinned update key
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            fincept-qt/CMakeLists.txt
            fincept-qt/src/services/updater/UpdateManifest.h
          sparse-checkout-cone-mode: false

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: FinceptTerminal-Windows-x64-installer
          path: dist/windows

      - name: Download Linux .deb
        uses: actions/download-artifact@v8
        with:
          name: FinceptTerminal-Linux-x64-installer
          path: dist/linux

      - name: Download macOS installer
        uses: actions/download-artifact@v8
        with:
          name: FinceptTerminal-macOS-arm64-installer
          path: dist/macos

      - name: Download Linux Flatpak
        uses: actions/download-artifact@v8
        with:
          name: FinceptTerminal-Linux-x86_64-flatpak
          path: dist/flatpak

      - name: List release assets
        run: find dist -type f | sort

      # ── Update manifest: updates.json + updates.json.sig ──────────────────
      # The in-app updater fetches releases/latest/download/updates.json and
      # updates.json.sig (these two assets of the newest non-prerelease
      # release) and falls back to the copies on main, which JOB 6 commits
      # byte for byte. It reads nothing in the manifest before the Ed25519
      # signature verifies against the public key pinned in
      # fincept-qt/src/services/updater/UpdateManifest.h, so a release without
      # a valid pair is invisible to every installed terminal. Either step
      # failing fails this job BEFORE the release is created.
      #
      # VERSION is this commit's CMake project version: the build jobs name the
      # installers after it and the binaries report it, so the manifest must
      # say exactly that (anything else would offer the update again after it
      # is installed). The generator also requires the tag to be v<VERSION>.
      #
      # Linux assets are linux-x64-deb and linux-x64-flatpak only. Installed
      # AppImage / .rpm copies (4.5.3 and older) find no package for their kind
      # and show the notes below with the release-page link — the one place an
      # already-shipped build can be told to move to the Flatpak or the .deb.
      - name: Generate update manifest (updates.json)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep -Eo 'project\(FinceptTerminal VERSION [0-9]+\.[0-9]+\.[0-9]+' fincept-qt/CMakeLists.txt | awk '{print $3}' || true)
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not parse project VERSION from fincept-qt/CMakeLists.txt"
            exit 1
          fi
          NOTES="Fincept Terminal v${VERSION}. Linux: the AppImage and .rpm builds are discontinued - if you use one, install the Flatpak (recommended) or the .deb from the release page."
          WORK=dist VERSION="${VERSION}" TAG="${TAG}" REPO="${REPO}" NOTES="${NOTES}" \
            python3 .github/scripts/generate_updates_manifest.py --output dist/updates.json
          cat dist/updates.json

      # The private key is the UPDATE_SIGNING_KEY repository secret, visible
      # to this step only. The script refuses an empty secret or a key that
      # does not match the pinned public key, and verifies the signature it
      # wrote against that pinned key before exiting 0.
      - name: Sign update manifest (updates.json.sig)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash .github/scripts/sign_updates_manifest.sh dist/updates.json dist/updates.json.sig

      - name: Create GitHub Release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Fincept Terminal ${{ github.ref_name }}"
          body: |
            ## Fincept Terminal ${{ github.ref_name }}

            Native C++20 financial intelligence terminal — Qt6, embedded Python analytics, 50+ screens.

            ### Downloads

            | Platform | File | Install |
            |----------|------|---------|
            | **Windows x64** | `FinceptTerminal-*-setup*.exe` | Run installer |
            | **Linux (Flatpak, any distribution)** | `FinceptTerminal-*-linux-x86_64.flatpak` | `flatpak install --user ./FinceptTerminal-*.flatpak`, then `flatpak run in.fincept.FinceptTerminal` |
            | **Linux (Debian/Ubuntu .deb)** | `FinceptTerminal-*-linux-x64.deb` | `sudo apt install ./FinceptTerminal-*.deb` |
            | **macOS Apple Silicon** | `FinceptTerminal-*.dmg` or setup | Open DMG → drag to Applications |

            ### Requirements
            - Windows 10/11 x64
            - Linux Flatpak: any x86_64 Linux with Flatpak; its runtime (org.kde.Platform 6.11) is installed from Flathub on first install
            - Linux .deb: Ubuntu 22.04+ / Debian 12+ and derivatives (x86_64, glibc 2.35+). Fedora, RHEL, Arch, openSUSE and others: use the Flatpak
            - The AppImage and .rpm are no longer published
            - macOS 13+ (Apple Silicon)

            See the [README](https://github.com/Fincept-Corporation/FinceptTerminal#readme) for full installation instructions.
          files: |
            dist/windows/**
            dist/linux/**
            dist/macos/**
            dist/flatpak/**
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # The manifest goes up LAST, in its own step: the release step above
      # publishes the release and uploads the installers concurrently, so a
      # manifest uploaded with them could be live while an installer it points
      # at is still uploading — a terminal checking in that window would offer
      # an update whose download fails. Uploaded here, every file the manifest
      # names is already downloadable. The signature goes first so the
      # manifest never appears without it.
      - name: Attach signed update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" dist/updates.json.sig --clobber --repo "${{ github.repository }}"
          gh release upload "${{ github.ref_name }}" dist/updates.json --clobber --repo "${{ github.repository }}"

# ═════════════════════════════════════════════════════════════════════════════
# JOB 6 — Update repo metadata on main (README download links + the signed
#          update manifest pair updates.json / updates.json.sig)
#
# Previously split into two jobs that both ran `needs: release` and both
# pushed to main — they raced and the loser died with
# `! [rejected] main -> main (fetch first)`. Merged into ONE job with ONE
# checkout, ONE commit (containing all file changes), and ONE push. No race
# possible. No retries needed.
#
# Outputs:
#  - README.md: download table rewritten with current release asset URLs
#  - updates.json + updates.json.sig: the release's OWN assets (generated and
#    signed by JOB 5), committed byte for byte. The in-app updater reads the
#    pair from the latest release and falls back to
#    raw.githubusercontent.com/.../main/updates.json (+ .sig), so main must
#    serve the same signed bytes. Nothing in this job may regenerate or
#    reformat them — the signature covers the exact bytes, and .gitattributes
#    marks both files -text. Prerelease tags (containing '-') leave them
#    alone: a prerelease is never "latest", and the fallback must not offer
#    one either.
# ═════════════════════════════════════════════════════════════════════════════
  update-repo-metadata:
    name: Update README + updates.json on main
    needs: release
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository (main branch, full history)
        uses: actions/checkout@v7
        with:
          # Write-scoped token so we can push the merged commit back.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Checkout main (not the tag) because we commit on top of main.
          ref: main
          # fetch-depth: 0 gives us full history. Needed so a future
          # `git pull --rebase` (only used if a human race-pushes to main
          # during the workflow — vanishingly rare but cheap insurance)
          # has the base commits available.
          fetch-depth: 0

      # ── Wait for the release to be fully published ────────────────────────
      # GitHub's release-creation step in the previous job returns as soon as
      # the release row exists, but the asset rows can take a few seconds to
      # propagate to the API. Poll for visibility once here; both downstream
      # steps (URL fetch + asset download) share this readiness gate instead
      # of each polling separately.
      - name: Wait for release to be visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            ASSET_COUNT=$(gh release view "${TAG}" --json assets --jq '.assets | length' 2>/dev/null || echo "0")
            echo "  attempt ${i}: ${ASSET_COUNT} asset(s) visible"
            [ "${ASSET_COUNT}" -ge 1 ] && exit 0
            sleep 5
          done
          echo "::error::Release ${TAG} still has no visible assets after 60s"
          exit 1

      # ── Fetch release asset URLs via gh CLI ───────────────────────────────
      # gh is pre-installed on all GitHub-hosted runners.
      - name: Fetch release asset URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Fetching asset URLs for release ${TAG}..."

          # Extract URLs for each platform (first match per pattern). Linux:
          # the Flatpak and the .deb — no AppImage / .rpm any more.
          WIN_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("(?i)windows.*\\.exe$|setup.*\\.exe$")) | .url' \
            | head -1)
          MAC_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.dmg$|macos.*setup")) | .url' \
            | head -1)
          DEB_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.deb$")) | .url' \
            | head -1)
          FLATPAK_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.flatpak$")) | .url' \
            | head -1)

          # Fallback: if browser_download_url not available via .url, try .browserDownloadUrl
          [ -z "$WIN_URL" ] && WIN_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("(?i)windows.*\\.exe$|setup.*\\.exe$")) | .browserDownloadUrl' \
            | head -1) || true
          [ -z "$MAC_URL" ] && MAC_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.dmg$|macos.*setup")) | .browserDownloadUrl' \
            | head -1) || true
          [ -z "$DEB_URL" ] && DEB_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.deb$")) | .browserDownloadUrl' \
            | head -1) || true
          [ -z "$FLATPAK_URL" ] && FLATPAK_URL=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.name | test("\\.flatpak$")) | .browserDownloadUrl' \
            | head -1) || true

          # Release page URL as final fallback
          RELEASE_URL="https://github.com/Fincept-Corporation/FinceptTerminal/releases/tag/${TAG}"
          WIN_URL="${WIN_URL:-${RELEASE_URL}}"
          MAC_URL="${MAC_URL:-${RELEASE_URL}}"
          DEB_URL="${DEB_URL:-${RELEASE_URL}}"
          FLATPAK_URL="${FLATPAK_URL:-${RELEASE_URL}}"

          echo "WIN_URL=${WIN_URL}" >> "$GITHUB_ENV"
          echo "MAC_URL=${MAC_URL}" >> "$GITHUB_ENV"
          echo "DEB_URL=${DEB_URL}" >> "$GITHUB_ENV"
          echo "FLATPAK_URL=${FLATPAK_URL}" >> "$GITHUB_ENV"
          echo "RELEASE_URL=${RELEASE_URL}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

          echo "Windows  : ${WIN_URL}"
          echo "macOS    : ${MAC_URL}"
          echo "Linux deb: ${DEB_URL}"
          echo "Flatpak  : ${FLATPAK_URL}"

      # ── Rewrite README download table ─────────────────────────────────────
      # Strategy: replace a clearly-delimited block between two sentinel
      # comments. Robust — no regex on links needed.
      - name: Update README download table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          START_MARKER="<!-- DOWNLOAD-TABLE-START -->"
          END_MARKER="<!-- DOWNLOAD-TABLE-END -->"

          NEW_BLOCK="${START_MARKER}
          Latest release: **${TAG}** — [View all releases](${RELEASE_URL})

          | Platform | Download | Run |
          |----------|----------|-----|
          | **Windows x64** | [FinceptTerminal-Windows-x64-setup.exe](${WIN_URL}) | Run installer → launch \`FinceptTerminal.exe\` |
          | **Linux x64 (Flatpak, any distribution)** | [FinceptTerminal-Linux-x86_64.flatpak](${FLATPAK_URL}) | \`flatpak install --user ./FinceptTerminal-*.flatpak\` |
          | **Linux x64 (Ubuntu 22.04+ / Debian 12+)** | [FinceptTerminal-Linux-x64.deb](${DEB_URL}) | \`sudo apt install ./FinceptTerminal-*.deb\` |
          | **macOS Apple Silicon** | [FinceptTerminal-macOS-arm64.dmg](${MAC_URL}) | Open DMG → drag to Applications |
          ${END_MARKER}"

          README="README.md"

          # Delegate regex replacement to a standalone Python script so
          # YAML indentation can't poison the Python source.
          export README NEW_BLOCK
          python3 .github/scripts/update_readme_table.py

          echo "=== README diff preview (first 60 lines) ==="
          git diff README.md | head -60 || true

      # ── Copy the release's signed update manifest ─────────────────────────
      # Downloaded, verified against the public key pinned in this checkout's
      # UpdateManifest.h (so main never serves a pair clients reject) and
      # copied with `cp` — never regenerated, never reformatted.
      - name: Copy updates.json + updates.json.sig from the release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          for i in $(seq 1 6); do
            rm -f "${WORK}/updates.json" "${WORK}/updates.json.sig"
            gh release download "${TAG}" --dir "${WORK}" \
              --pattern 'updates.json' --pattern 'updates.json.sig' || true
            if [ -s "${WORK}/updates.json" ] && [ -s "${WORK}/updates.json.sig" ]; then
              break
            fi
            echo "  attempt ${i}: updates.json / updates.json.sig not downloadable yet"
            sleep 5
          done
          if [ ! -s "${WORK}/updates.json" ] || [ ! -s "${WORK}/updates.json.sig" ]; then
            echo "::error::Release ${TAG} lacks the updates.json / updates.json.sig assets that the release job attaches — re-run the release job, then this one"
            exit 1
          fi
          bash .github/scripts/sign_updates_manifest.sh --verify "${WORK}/updates.json" "${WORK}/updates.json.sig"
          cp "${WORK}/updates.json" updates.json
          cp "${WORK}/updates.json.sig" updates.json.sig
          git status --short -- updates.json updates.json.sig

      # ── Single atomic commit + push ───────────────────────────────────────
      # All files in one commit → one push → no race with anything. If
      # nothing changed (rare but possible, e.g. re-running the same tag),
      # exit cleanly without an empty commit.
      - name: Commit and push repo metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          README_CHANGED=0
          MANIFEST_CHANGED=0
          git diff --quiet README.md || README_CHANGED=1
          # `git status`, not `git diff`: updates.json.sig is untracked until
          # its first commit, and `git diff` does not see untracked files.
          [ -z "$(git status --porcelain -- updates.json updates.json.sig)" ] || MANIFEST_CHANGED=1

          if [ "${README_CHANGED}" -eq 0 ] && [ "${MANIFEST_CHANGED}" -eq 0 ]; then
            echo "Neither README.md nor the update manifest changed — nothing to commit"
            exit 0
          fi

          # Stage only what we own. Never `git add -A` in automation: a
          # stray artefact from an earlier step would sneak into main. The
          # manifest and its signature are only ever staged together.
          [ "${README_CHANGED}"   -eq 1 ] && git add README.md
          [ "${MANIFEST_CHANGED}" -eq 1 ] && git add updates.json updates.json.sig

          case "${README_CHANGED}${MANIFEST_CHANGED}" in
            11) SUBJECT="update README download links and the update manifest for ${TAG}" ;;
            10) SUBJECT="update README download links for ${TAG}" ;;
            *)  SUBJECT="update the update manifest for ${TAG}" ;;
          esac
          git commit -m "chore(release): ${SUBJECT}

          Auto-generated by the release workflow after a successful build.
          README.md carries the download table with the ${TAG} asset URLs;
          updates.json + updates.json.sig are the ${TAG} release's signed update
          manifest, copied byte for byte (the in-app updater's fallback when the
          latest release's own copy cannot be fetched).

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Defensive: if a human raced us and pushed to main during this
          # workflow, rebase once and retry. We do NOT race any sibling job
          # here (there are none), so this should almost never fire.
          if ! git push origin main; then
            echo "::warning::push rejected (likely external push to main); rebasing once..."
            git pull --rebase origin main
            git push origin main
          fi
          echo "Repo metadata pushed to main"
